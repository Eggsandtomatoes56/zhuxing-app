}

function renderGenericList(records) {
  const wrap = $('#genericList');
  if (records.length === 0) {
    wrap.innerHTML = emptyHTML('note', '还没有记录', '点击上方按钮记录今天读了什么');
    return;
  }
  wrap.innerHTML = records.map(r => `
    <div class="history-card glass" style="margin-bottom:12px;" data-id="${r.id}">
      <div class="history-head">
        <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
          <span style="font-size:20px;">📝</span>
          <div class="history-date">${r.date || ''} ${r.date === todayStr() ? '<span class="history-date-today">今天</span>' : ''}</div>
        </div>
        <div style="display:flex;gap:8px;">
          <button class="history-del" data-act="edit">编辑</button>
          <button class="history-del" data-act="del">删除</button>
        </div>
      </div>
      <div style="font-weight:700;font-size:16px;margin:6px 0 4px;">${escapeHTML(r.title || '无标题')}</div>
      <div style="color:var(--ink-2);font-size:14px;line-height:1.6;white-space:pre-wrap;">${escapeHTML(r.content || '')}</div>
      ${r.tags && r.tags.length ? `<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;">${r.tags.map(t => `<span class="recipe-tag">${escapeHTML(t)}</span>`).join('')}</div>` : ''}
      ${r.pages || r.duration ? `<div style="font-size:12px;color:var(--muted);margin-top:6px;">${r.pages ? `📄 ${escapeHTML(r.pages)}页` : ''} ${r.duration ? `⏱ ${escapeHTML(r.duration)}分钟` : ''}</div>` : ''}
    </div>
  `).join('');
  wrap.querySelectorAll('.history-card').forEach(el => {
    const id = +el.dataset.id;
    const rec = DB.genericRecords.find(x => x.id === id);
    el.style.cursor = 'pointer';
    el.querySelector('[data-act="edit"]').addEventListener('click', (e) => { e.stopPropagation(); openGenericRecordEditor(rec); });
    el.querySelector('[data-act="del"]').addEventListener('click', (e) => { e.stopPropagation(); DB.genericRecords = DB.genericRecords.filter(x => x.id !== id); DB.save(); renderAll(); toast('记录已删除'); });
    // 整个卡片点击即可编辑（点击删除按钮除外）
    el.addEventListener('click', (e) => {
      if (e.target.closest('[data-act="del"]') || e.target.closest('[data-act="edit"]')) return;
      openGenericRecordEditor(rec);
    });
  });
}

function openGenericRecordEditor(existing) {
  const e = existing || { date: todayStr(), title: '', content: '', tags: [], pages: '', duration: '' };
  const tagsStr = Array.isArray(e.tags) ? e.tags.join(', ') : (e.tags || '');
  openModal(`
    <div class="modal-title">${existing ? '编辑记录' : '添加记录'}</div>
    <div class="field"><label class="field-label">日期</label><input type="date" class="field-input" id="g-date" value="${escapeHTML(e.date || todayStr())}" /></div>
    <div class="field"><label class="field-label">标题</label><input class="field-input" id="g-title" placeholder="如：《活着》第3章 / 前端技术文章" value="${escapeHTML(e.title || '')}" /></div>
    <div class="field"><label class="field-label">内容 / 心得</label><textarea class="field-input" id="g-content" rows="5" placeholder="记录今天读的内容和感想...">${escapeHTML(e.content || '')}</textarea></div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
      <div class="field"><label class="field-label">页数 / 进度</label><input class="field-input" id="g-pages" placeholder="如：15-28" value="${escapeHTML(e.pages || '')}" /></div>
      <div class="field"><label class="field-label">时长（分钟）</label><input class="field-input" id="g-duration" placeholder="如：40" inputmode="numeric" value="${escapeHTML(e.duration || '')}" /></div>
    </div>
    <div class="field"><label class="field-label">标签（用逗号分隔）</label><input class="field-input" id="g-tags" placeholder="如：文学, 成长, 技术" value="${escapeHTML(tagsStr)}" /></div>
    <div class="modal-actions"><button class="btn btn-ghost" onclick="closeModal()">取消</button><button class="btn btn-primary" id="gSave">保存</button></div>
  `);
  $('#gSave').addEventListener('click', () => {
    const date = $('#g-date').value.trim();
    const title = $('#g-title').value.trim();
    const content = $('#g-content').value.trim();
    const pages = $('#g-pages').value.trim();
    const duration = $('#g-duration').value.trim();
    const tags = $('#g-tags').value.split(/[,，]/).map(s => s.trim()).filter(Boolean);
    if (!title && !content) { toast('请至少填写标题或内容'); return; }
    if (existing) {
      existing.date = date; existing.title = title; existing.content = content; existing.pages = pages; existing.duration = duration; existing.tags = tags; existing.ts = Date.now();
    } else {
      DB.genericRecords.push({ id: uid(), pid: currentPid, date, title, content, pages, duration, tags, ts: Date.now() });
    }
    DB.save(); closeModal(); renderAll(); toast('记录已保存');
  });
}

/* ===== 新闻资讯（记录型） ===== */
function renderNewsRecords() {

  const records = DB.genericRecords.filter(r => r.pid === currentPid).slice().sort((a,b) => (b.date || '').localeCompare(a.date || ''));

async function fetchHotNews(filter) {
  const box = $('#hotNewsBox');
  if (!box) return;
  // 5分钟内使用缓存（手动刷新按钮强制更新）
  if (window._hotNewsCache && window._hotNewsCacheTime && (Date.now() - window._hotNewsCacheTime < 5 * 60 * 1000) && !window._hotNewsForce) {
    renderHotNews(window._hotNewsCache, filter);
    return;
  }
  window._hotNewsForce = false;
  box.innerHTML = `<div style="text-align:center;padding:20px;color:var(--muted);font-size:13px;"><span class="spin" style="display:inline-block;width:16px;height:16px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin 0.8s linear infinite;vertical-align:-2px;margin-right:6px;"></span>正在获取最新资讯...</div>`;
  const proxyList = [
    (u) => `https://api.allorigins.win/raw?url=${encodeURIComponent(u)}`,
    (u) => `https://corsproxy.io/?url=${encodeURIComponent(u)}`,
    (u) => `https://api.codetabs.com/v1/proxy/?quest=${encodeURIComponent(u)}`,
  ];
  let allNews = [];
  let okCount = 0;
  // 分批抓取（每批 4 个源并行，避免代理限流）
  const batchSize = 4;
  const results = [];
  for (let bi = 0; bi < NEWS_SOURCES.length; bi += batchSize) {
    const batch = NEWS_SOURCES.slice(bi, bi + batchSize);
    const batchResults = await Promise.allSettled(batch.map(async (src) => {
      for (const mk of proxyList) {
        try {
          const ctrl = new AbortController();
          const t = setTimeout(() => ctrl.abort(), 8000);
          const resp = await fetch(mk(src.url), { signal: ctrl.signal });
          clearTimeout(t);
          if (!resp.ok) continue;
          if (src.isJSON) {
            const data = await resp.json();
            return (data.stories || []).slice(0, 8).map(s => ({
              title: s.title,
              link: src.fixLink === 'zhihu'
                ? (s.url || (s.id ? `https://daily.zhihu.com/story/${s.id}` : ''))
                : (s.url || ''),
              source: src.name,
              category: src.category, pubDate: '', desc: '',
              isVideo: !!src.isVideo
            }));
          }
          const text = await resp.text();
          return parseRSS(text, src);
        } catch (e) { /* 试下一个代理 */ }
      }
      return [];
    }));
    results.push(...batchResults);
  }
  results.forEach(r => {
    if (r.status === 'fulfilled' && r.value.length) { allNews = allNews.concat(r.value); okCount++; }
  });
  // 缓存到内存
  window._hotNewsCache = allNews;
  window._hotNewsCacheTime = Date.now();
  renderHotNews(allNews, filter);
  if (allNews.length === 0) {
    box.innerHTML = `<div style="text-align:center;padding:16px;color:var(--muted);font-size:13px;">暂无法获取资讯（网络或代理受限），可手动添加<br><button id="hotNewsRetry" style="margin-top:8px;font-size:12px;color:var(--accent);background:none;border:none;cursor:pointer;">重试</button></div>`;
    $('#hotNewsRetry').addEventListener('click', () => { window._hotNewsForce = true; fetchHotNews('all'); });
  } else {
    toast(`已获取 ${allNews.length} 条资讯（${okCount}/${NEWS_SOURCES.length} 源）`);
  }
}

function parseRSS(xmlText, src) {
  try {
    const doc = new DOMParser().parseFromString(xmlText, 'text/xml');
    const items = [...doc.querySelectorAll('item, entry')].slice(0, 8);
    return items.map(it => {
      const get = (tag) => { const el = it.querySelector(tag); return el ? el.textContent.trim() : ''; };
      const title = get('title');
      const link = get('link') || (it.querySelector('link') && it.querySelector('link').getAttribute('href')) || '';
      const pubDate = get('pubDate') || get('published') || get('updated') || '';
      let desc = get('description') || get('summary') || get('content') || '';
      desc = desc.replace(/<[^>]+>/g, '').slice(0, 120);
      return { title, link, source: src.name, category: src.category, pubDate, desc, isVideo: !!src.isVideo, official: !!src.official };
    }).filter(n => n.title);
  } catch (e) { return []; }
}

  box.innerHTML = list.slice(0, 30).map((n, i) => {

    const offTag = n.official ? `<span style="background:#e3f2fd;color:#1565c0;padding:1px 6px;border-radius:4px;font-size:10px;">✓ 官方</span>` : '';
    const playIcon = n.isVideo ? '▶ ' : '';
    return `
    <div class="hot-news-item" data-idx="${i}" style="display:flex;align-items:flex-start;gap:8px;padding:10px 0;border-bottom:1px solid var(--border);cursor:default;">
      <span style="flex-shrink:0;width:20px;text-align:center;font-size:12px;color:var(--muted);font-weight:700;margin-top:1px;">${i + 1}</span>
      <div style="flex:1;min-width:0;">
        <div class="hot-news-title" data-idx="${i}" style="font-size:13px;font-weight:600;line-height:1.5;color:var(--ink-1);${n.link ? 'cursor:pointer;' : ''}">${playIcon}${escapeHTML(n.title)}</div>
        ${n.desc ? `<div style="font-size:11px;color:var(--muted);margin-top:3px;line-height:1.4;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;">${escapeHTML(n.desc)}</div>` : ''}

          <span style="background:var(--surface-2);padding:1px 6px;border-radius:4px;">${escapeHTML(n.source)}</span>
          <span style="background:var(--accent-soft);color:var(--accent-ink);padding:1px 6px;border-radius:4px;">${escapeHTML(n.category)}</span>
          ${videoTag}${offTag}
        </div>
      </div>
      <button class="collect-news-btn" data-idx="${i}" style="flex-shrink:0;font-size:11px;padding:4px 10px;border:1px solid var(--accent);border-radius:6px;background:var(--accent-soft);color:var(--accent-ink);cursor:pointer;white-space:nowrap;">⭐ 收藏</button>
    </div>`;
  }).join('');
  // 绑定标题点击打开原文
  box.querySelectorAll('.hot-news-title').forEach(el => {
    el.addEventListener('click', () => {
      const idx = +el.dataset.idx;
      const n = list[idx];
      if (n && n.link) window.open(n.link, '_blank');
    });
  });
  // 绑定收藏按钮
  box.querySelectorAll('.collect-news-btn').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      const idx = +btn.dataset.idx;
      const n = list[idx];
      if (!n) return;
      // 检查是否已收藏（按标题）
      const dup = DB.genericRecords.find(r => r.pid === currentPid && r.title === n.title);
      if (dup) { toast('已收藏过这条资讯'); return; }
      DB.genericRecords.push({
        id: uid(), pid: currentPid, date: todayStr(), title: n.title,
        content: n.desc || '', source: n.source, category: n.category,
        importance: '一般', link: n.link || '', tags: [], ts: Date.now()
      });
      DB.save(); renderAll(); toast('已收藏到我的记录');
      btn.textContent = '✓ 已收藏'; btn.style.opacity = '0.6'; btn.disabled = true;
    });
  });
}

function renderNewsList(records) {

    const imp = (r.importance || '一般');
    return `
    <div class="history-card glass" style="margin-bottom:12px;" data-id="${r.id}">
      <div class="history-head">
        <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
          <span style="font-size:18px;">${impMap[imp] || '📰'}</span>
          <div>
            <div style="font-weight:700;font-size:15px;">${escapeHTML(r.title || '无标题')}</div>
            <div style="font-size:11px;color:var(--muted);margin-top:2px;">
              ${r.date || ''} ${r.source ? '· ' + escapeHTML(r.source) : ''} ${r.category ? ' · ' + escapeHTML(r.category) : ''} ${imp ? ' · ' + imp : ''}
            </div>
          </div>
        </div>
        <div style="display:flex;gap:6px;">
          <button class="history-del" data-act="edit">编辑</button>
          <button class="history-del" data-act="del">删除</button>

      ${r.link ? `<a href="${escapeHTML(r.link)}" target="_blank" rel="noopener" onclick="event.stopPropagation()" style="display:inline-flex;align-items:center;gap:4px;margin-top:6px;font-size:12px;color:var(--accent);">🔗 查看原文</a>` : ''}
      ${r.tags && r.tags.length ? `<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;">${r.tags.map(t => `<span class="recipe-tag">${escapeHTML(t)}</span>`).join('')}</div>` : ''}
    </div>`;
  }).join('');
  wrap.querySelectorAll('.history-card').forEach(el => {
    const id = +el.dataset.id;
    const rec = DB.genericRecords.find(x => x.id === id);
    el.style.cursor = 'pointer';
    el.querySelector('[data-act="edit"]').addEventListener('click', (e) => { e.stopPropagation(); openNewsEditor(rec); });
    el.querySelector('[data-act="del"]').addEventListener('click', (e) => {
      e.stopPropagation();
      DB.genericRecords = DB.genericRecords.filter(x => x.id !== id);
      DB.save(); renderAll(); toast('资讯已删除');
    });
    // 整卡点击即可编辑（点击删除/编辑按钮除外）
    el.addEventListener('click', (e) => {
      if (e.target.closest('[data-act="del"]') || e.target.closest('[data-act="edit"]')) return;
      if (e.target.tagName === 'A' || e.target.closest('a')) return;
      openNewsEditor(rec);
    });
  });
}

function openNewsEditor(existing) {
  const e = existing || { date: todayStr(), title: '', content: '', tags: [], source: '', category: '', importance: '一般', link: '' };
  const tagsStr = Array.isArray(e.tags) ? e.tags.join(', ') : (e.tags || '');
  openModal(`
    <div class="modal-title">${existing ? '编辑资讯' : '记录一条资讯'}</div>
    <div class="field"><label class="field-label">日期</label><input type="date" class="field-input" id="n-date" value="${escapeHTML(e.date || todayStr())}" /></div>
    <div class="field"><label class="field-label">资讯标题 *</label><input class="field-input" id="n-title" placeholder="如：XX政策发布、AI新模型" value="${escapeHTML(e.title || '')}" /></div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
      <div class="field"><label class="field-label">分类</label><input class="field-input" id="n-category" placeholder="如：科技 / 财经 / 政策" value="${escapeHTML(e.category || '')}" /></div>
      <div class="field"><label class="field-label">来源</label><input class="field-input" id="n-source" placeholder="如：人民日报 / 36氪 / Twitter" value="${escapeHTML(e.source || '')}" /></div>
    </div>
    <div class="field"><label class="field-label">重要程度</label><div class="tag-pick" id="nImpPick">
      <button class="tag-opt ${e.importance==='重要'?'sel':''}" data-v="重要">🔥 重要</button>
      <button class="tag-opt ${e.importance==='一般'||!e.importance?'sel':''}" data-v="一般">📌 一般</button>
      <button class="tag-opt ${e.importance==='待看'?'sel':''}" data-v="待看">⏳ 待看</button>
    </div></div>
    <div class="field"><label class="field-label">摘要 / 关键内容</label><textarea class="field-input" id="n-content" rows="4" placeholder="一句话总结或摘抄要点...">${escapeHTML(e.content || '')}</textarea></div>

    <div class="modal-actions"><button class="btn btn-ghost" onclick="closeModal()">取消</button><button class="btn btn-primary" id="nSave">保存</button></div>
  `);

  $$('#nImpPick .tag-opt').forEach(b => b.onclick = () => { $$('#nImpPick .tag-opt').forEach(x => x.classList.remove('sel')); b.classList.add('sel'); imp = b.dataset.v; });
  $('#nSave').onclick = () => {
    const date = $('#n-date').value.trim();
    const title = $('#n-title').value.trim();
    const content = $('#n-content').value.trim();
    const source = $('#n-source').value.trim();
    const category = $('#n-category').value.trim();
    const link = $('#n-link').value.trim();
    const tags = $('#n-tags').value.split(/[,，]/).map(s => s.trim()).filter(Boolean);
    if (!title) { toast('请填写资讯标题'); return; }
    if (existing) {
      Object.assign(existing, { date, title, content, source, category, importance: imp, link, tags, ts: Date.now() });
    } else {
      DB.genericRecords.push({ id: uid(), pid: currentPid, date, title, content, source, category, importance: imp, link, tags, ts: Date.now() });
    }
    DB.save(); closeModal(); renderAll(); toast('资讯已记录');
  };
}

    const id = +el.dataset.id;
    el.style.cursor = 'pointer';
    el.querySelector('[data-act="edit"]').addEventListener('click', (e) => { e.stopPropagation();
      const rec = DB.travelRecords.find(x => x.id === id);
      openTravelEditor(rec);
    });
    el.querySelector('[data-act="del"]').addEventListener('click', (e) => {
      e.stopPropagation();
      DB.travelRecords = DB.travelRecords.filter(x => x.id !== id); DB.save(); renderAll(); toast('记录已删除');
    });
    // 整卡点击即可编辑
    el.addEventListener('click', (e) => {
      if (e.target.closest('[data-act="del"]') || e.target.closest('[data-act="edit"]')) return;
      const rec = DB.travelRecords.find(x => x.id === id);
      if (rec) openTravelEditor(rec);
    });
  });
}

    </div>

    </div></div>
    <div class="field"><label class="field-label">✍️ 感受 / 灵光一现（选填）</label><textarea class="field-area" id="t-note" placeholder="写下这次旅行的心情、发现、值得记录的瞬间...">${escapeHTML(e.notes)}</textarea></div>

  `);
  $('#t-rec').querySelectorAll('.tag-opt').forEach(b => b.addEventListener('click', () => {

  }));

    const location = $('#t-loc').value.trim();
    if (!location) { toast('请填写地点'); return; }
    const dateStart = $('#t-ds').value;
    if (!dateStart) { toast('请选择到达日期'); return; }
    const data = {

      dateEnd: $('#t-de').value,
      tripType: $('#t-type').value,

    DB.save(); closeModal(); renderAll(); toast(existing ? '已更新' : '行程已添加');
  });
}

      DB.movieRecords = DB.movieRecords.filter(x => x.id !== id); DB.save(); renderAll(); toast('记录已删除');

function openMovieEditor(existing) {

      </select></div>
      <div class="field"><label class="field-label">📅 观看日期</label><input class="field-input" id="m-date" type="date" value="${e.watchDate}" /></div>
    </div>
    <div class="field"><label class="field-label">🏷️ 标签（可多选）</label><div class="tag-pick" id="m-tags">

    <div class="field"><label class="field-label">✍️ 观后感 *</label><textarea class="field-area" id="m-review" placeholder="这部电影给你什么感受？哪个情节最打动你？演员表演如何？" style="min-height:100px;">${escapeHTML(e.review)}</textarea></div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
      <div class="field"><label class="field-label">🔁 是否值得二刷？</label><div class="tag-pick" id="m-re">
        ${['一定会', '是', '可能', '不会'].map(t => `<button class="tag-opt ${e.rewatch===t?'sel':''}" data-v="${t}">${t}</button>`).join('')}
      </div></div>
      <div class="field"><label class="field-label">😊 看完的心情</label><select class="field-input" id="m-mood">
        ${['', '感动落泪', '热血沸腾', '意犹未尽', '震撼无比', '温暖治愈', '爆笑不止', '细思极恐', '心情复杂', '有点失望', '无聊犯困'].map(m => `<option ${e.mood===m?'selected':''}>${m}</option>`).join('')}
      </select></div>
    </div>
    <div class="field"><label class="field-label">💬 印象深刻的台词（选填）</label><textarea class="field-area" id="m-quote" placeholder="如：我们的人，一定可以完成任务。">${escapeHTML(e.quote)}</textarea></div>
    <div class="modal-actions"><button class="btn btn-ghost" onclick="closeModal()">取消</button><button class="btn btn-primary" id="m-save">保存</button></div>
  `);
  $('#m-tags').querySelectorAll('.tag-opt').forEach(b => b.addEventListener('click', () => {
    const v = b.dataset.v;
    if (pickedTags.includes(v)) { pickedTags = pickedTags.filter(x => x !== v); b.classList.remove('sel'); }
    else { pickedTags.push(v); b.classList.add('sel'); }
  }));
  $('#m-re').querySelectorAll('.tag-opt').forEach(b => b.addEventListener('click', () => {
    $('#m-re').querySelectorAll('.tag-opt').forEach(x => x.classList.remove('sel')); b.classList.add('sel');
  }));

    const name = $('#m-name').value.trim();

    if (!review) { toast('请写写观后感吧'); return; }

      name,
      channel: $('#m-ch').value,
      score: $('#m-score').value.trim(),
      tags: pickedTags.slice(),
      review,
      rewatch: $('#m-re').querySelector('.tag-opt.sel')?.dataset.v || '是',

      quote: $('#m-quote').value.trim(),
      watchDate: $('#m-date').value,
      ts: Date.now()

    if (existing) { Object.assign(existing, data); }
    else { DB.movieRecords.push({ id: uid(), ...data }); }
    DB.save(); closeModal(); renderAll(); toast(existing ? '已更新' : '观影记录已添加');
  });
}

function fmtRemind(ts) {
  const d = new Date(ts);
  const now = new Date();
  const isToday = d.toDateString() === now.toDateString();
  const tomorrow = new Date(now); tomorrow.setDate(now.getDate()+1);
  const isTomorrow = d.toDateString() === tomorrow.toDateString();
  const hh = String(d.getHours()).padStart(2,'0');
  const mm = String(d.getMinutes()).padStart(2,'0');
  if (isToday) return `今天 ${hh}:${mm}`;
  if (isTomorrow) return `明天 ${hh}:${mm}`;
  return `${d.getMonth()+1}月${d.getDate()}日 ${hh}:${mm}`;
}

// 图片大图查看器
function openImgViewer(url) {
  let viewer = $('#imgViewer');
  if (!viewer) {
    viewer = document.createElement('div');
    viewer.id = 'imgViewer';
    viewer.className = 'img-viewer';
    viewer.innerHTML = `<div class="img-viewer-close" id="imgViewerClose"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg></div><img id="imgViewerImg" />`;
    document.body.appendChild(viewer);
    viewer.addEventListener('click', e => {
      if (e.target === viewer || e.target.closest('#imgViewerClose')) {
        viewer.classList.remove('show');
        const img = $('#imgViewerImg');
        if (img.dataset.objUrl) { URL.revokeObjectURL(img.dataset.objUrl); img.dataset.objUrl = ''; }

function bindTaskItems(scope) {
  scope.querySelectorAll('.task-item').forEach(el => {
    const id = +el.dataset.id;
    const wrap = el.closest('.task-wrap');
    
    // 卡片点击打开详情
    el.addEventListener('click', (e) => {
      // 如果点击的是交互元素，不打开详情
      if (e.target.closest('[data-act]') || e.target.closest('.task-check') || e.target.closest('.task-del') || e.target.closest('.task-action-btn')) {
        return;
      }
      const t = DB.tasks.find(x => x.id === id);
      if (t) openTaskDetailModal(t);
    });

    el.querySelector('[data-act="toggle"]').addEventListener('click', (e) => {
      e.stopPropagation();
      const t = DB.tasks.find(x => x.id === id);
      t.done = !t.done; t.doneTs = t.done ? Date.now() : null;
      DB.save(); renderAll(); toast(t.done ? '已完成' : '已恢复');
      if (t.done) { checkStreak(); celebrate('🎯', '任务完成！'); }
    });
    el.querySelector('[data-act="del"]').addEventListener('click', (e) => {
      e.stopPropagation();
      const t = DB.tasks.find(x => x.id === id);
      if (!t) return;
      // 如果任务有图片，弹窗确认
      if (t.images && t.images.length > 0) {
        openModal(`
          <div class="modal-title">删除任务</div>
          <div style="font-size:14px;color:var(--ink-2);margin-bottom:16px;">该任务包含 ${t.images.length} 张图片，确定要删除吗？</div>
          <div class="modal-actions">
            <button class="btn btn-ghost" onclick="closeModal()">取消</button>
            <button class="btn btn-primary" id="confirmDelImgTask" style="background:var(--danger);">确认删除</button>
          </div>
        `);
        $('#confirmDelImgTask').onclick = () => {
          DB.tasks = DB.tasks.filter(x => x.id !== id);
          DB.save(); closeModal(); renderAll(); toast('任务已删除');
        };
        return;
      }
      wrap.style.transform = 'translateX(100%)'; wrap.style.opacity = '0';
      setTimeout(() => { DB.tasks = DB.tasks.filter(x => x.id !== id); DB.save(); renderAll(); }, 200);
      toast('已删除');
    });

    // 加日历按钮
    const calBtn = el.querySelector('[data-act="cal"]');
    if (calBtn) {
      calBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        const t = DB.tasks.find(x => x.id === id);
        if (t && t.remindAt) exportToCalendar(t);
      });
    }
  });

  // 绑定滑动操作按钮
  scope.querySelectorAll('.swipe-btn').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      const wrap = btn.closest('.task-wrap');
      const id = +wrap.dataset.id;
      const act = btn.dataset.swipe;
      const t = DB.tasks.find(x => x.id === id);
      if (!t) return;
      if (act === 'complete' && !t.done) {
        t.done = true; t.doneTs = Date.now();
        DB.save(); renderAll(); toast('已完成');
        checkStreak(); celebrate('🎯', '任务完成！');
      } else if (act === 'delete') {
        if (t.imgId) VideoStore.deleteImg(t.imgId).catch(()=>{});
        DB.tasks = DB.tasks.filter(x => x.id !== id);
        DB.save(); renderAll(); toast('已删除');
      }
    });
  });
}

/* ===== 任务提醒系统 ===== */
// 导出任务到手机日历（.ics文件）
function exportToCalendar(task) {
  const d = new Date(task.remindAt);
  const pad = (n) => String(n).padStart(2, '0');
  // ics 时间格式：YYYYMMDDTHHMMSS
  const dtStart = `${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}T${pad(d.getHours())}${pad(d.getMinutes())}00`;
  const dtEnd = new Date(d.getTime() + 30 * 60 * 1000); // 持续30分钟
  const dtEndStr = `${dtEnd.getFullYear()}${pad(dtEnd.getMonth()+1)}${pad(dtEnd.getDate())}T${pad(dtEnd.getHours())}${pad(dtEnd.getMinutes())}00`;
  const p = DB.projects.find(x => x.id === task.pid);
  const projName = p ? p.name : '逐行';
  // 提前15分钟提醒
  const alarmDT = new Date(d.getTime() - 15 * 60 * 1000);
  const alarmStr = `${alarmDT.getFullYear()}${pad(alarmDT.getMonth()+1)}${pad(alarmDT.getDate())}T${pad(alarmDT.getHours())}${pad(alarmDT.getMinutes())}00`;
  const ics = [
    'BEGIN:VCALENDAR',
    'VERSION:2.0',
    'PRODID:-//Workbench//Workbench Task//CN',
    'BEGIN:VEVENT',
    `UID:${task.id}@workbench`,
    `DTSTAMP:${dtStart}`,
    `DTSTART:${dtStart}`,
    `DTEND:${dtEndStr}`,
    `SUMMARY:${task.text}`,
    `DESCRIPTION:来自「${projName}」项目的高优先级任务`,
    'BEGIN:VALARM',
    'TRIGGER:-PT15M',
    'ACTION:DISPLAY',
    `DESCRIPTION:${task.text}`,
    'END:VALARM',
    'END:VEVENT',
    'END:VCALENDAR'
  ].join('\r\n');
  const blob = new Blob([ics], { type: 'text/calendar;charset=utf-8' });
  const url = trackObjectURL(URL.createObjectURL(blob));
  const a = document.createElement('a');
  a.href = url;
  a.download = `提醒_${task.text.slice(0,20)}_${dtStart}.ics`;
  a.click();
  setTimeout(() => { try { URL.revokeObjectURL(url); } catch(e){} }, 1500);
  toast('已生成日历文件，请在打开的日历中保存');
}

// 发送系统通知
function sendSystemNotification(title, body) {
  if (!('Notification' in window)) return false;
  if (Notification.permission !== 'granted') return false;
  try {
    const n = new Notification(title, {
      body: body,
      icon: './icon-192.png',
      tag: 'workbench-remind',
      vibrate: [200, 100, 200]
    });
    n.onclick = () => { window.focus(); n.close(); };
    return true;
  } catch (e) { return false; }
}

// 应用内提醒弹窗
function showInAppAlert(task) {
  const p = DB.projects.find(x => x.id === task.pid);
  const projName = p ? p.name : '';
  const d = new Date(task.remindAt);
  const timeStr = `${d.getMonth()+1}月${d.getDate()}日 ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
  // 遮罩
  const mask = document.createElement('div');
  mask.style.cssText = 'position:fixed;inset:0;z-index:88;background:rgba(0,0,0,0.5);animation:fade .2s ease;';
  const alert = document.createElement('div');
  alert.className = 'remind-alert';
  alert.innerHTML = `
    <div class="remind-alert-icon">⏰</div>
    <div class="remind-alert-title">任务提醒</div>
    <div class="remind-alert-text">${escapeHTML(task.text)}</div>
    <div class="remind-alert-time">${projName ? '来自「' + escapeHTML(projName) + '」· ' : ''}${timeStr}</div>
    <div class="remind-alert-actions">
      <button class="btn btn-ghost" id="remindLater">稍后</button>
      <button class="btn btn-primary" id="remindDone">完成了</button>
    </div>
  `;
  mask.appendChild(alert);
  document.body.appendChild(mask);
  // 震动
  if (navigator.vibrate) navigator.vibrate([200, 100, 200, 100, 200]);
  // 声音（短促提示音）
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain); gain.connect(ctx.destination);
    osc.frequency.value = 880; osc.type = 'sine';
    gain.gain.setValueAtTime(0.3, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.5);
    osc.start(); osc.stop(ctx.currentTime + 0.5);
  } catch (e) {}
  $('#remindLater').onclick = () => { mask.remove(); };
  $('#remindDone').onclick = () => {
    task.done = true; task.doneTs = Date.now();
    DB.save(); renderAll(); mask.remove();
    toast('已标记完成'); celebrate('🎯', '任务完成！');
  };
}

// 定时检查提醒
function checkReminders() {
  const now = Date.now();
  let changed = false;
  DB.tasks.forEach(t => {
    if (t.remindAt && !t.reminded && !t.done && now >= t.remindAt) {
      t.reminded = true; changed = true;
      // 1. 应用内弹窗
      showInAppAlert(t);
      // 2. 系统通知
      sendSystemNotification('⏰ 任务提醒：' + t.text, '点击查看详情');
    }
  });
  if (changed) DB.save();
}
// 每30秒检查一次
setInterval(checkReminders, 30000);
// 页面可见时立即检查
document.addEventListener('visibilitychange', () => { if (!document.hidden) checkReminders(); });

function addProjectTask(imgFile, remindAt, onDone) {

function renderProjectStats() {
  const panel = $('#panel-stats');
  if (!panel) return;
  const p = DB.projects.find(x => x.id === currentPid);
  const tasks = DB.tasks.filter(t => t.pid === currentPid);
  const done = tasks.filter(t => t.done).length;
  const total = tasks.length;
  const rate = total ? done/total : 0;

  // 7日柱状图
  const days = [];
  const today = new Date();
  for (let i = 6; i >= 0; i--) {
    const d = new Date(today); d.setDate(d.getDate() - i);
    const label = ['日','一','二','三','四','五','六'][d.getDay()];
    const count = tasks.filter(t => t.done && t.doneTs && new Date(t.doneTs).toDateString() === d.toDateString()).length
      || tasks.filter(t => t.done && new Date(t.ts).toDateString() === d.toDateString()).length;
    days.push({ label, count, isToday: i === 0 });
  }
  const max = Math.max(...days.map(d => d.count), 1);

  // 优先级分布
  const todo = tasks.filter(t => !t.done);
  const dist = { high: 0, mid: 0, low: 0 };
  todo.forEach(t => dist[t.pri]++);
  const maxPri = Math.max(...Object.values(dist), 1);

  panel.innerHTML = `
    <div class="chart-card">
      <div class="chart-title">近 7 天完成</div>
      <div class="chart-desc">每天完成的任务数量</div>
      <div class="bar-chart">${days.map(d => `
        <div class="bar-col"><span class="bar-val">${d.count}</span>
          <div class="bar-fill ${d.isToday?'today':''}" style="height:${d.count/max*100}%;background:linear-gradient(180deg,${p.color},${p.color}cc)"></div>
          <span class="bar-label">${d.label}</span></div>`).join('')}</div>
    </div>
    <div class="chart-card">
      <div class="chart-title">完成率</div>
      <div class="chart-desc">已完成 / 总任务</div>
      <div class="ring-wrap">
        <div class="ring">
          <svg width="110" height="110" viewBox="0 0 110 110">
            <circle class="ring-track" cx="55" cy="55" r="48"/>
            <circle class="ring-prog" cx="55" cy="55" r="48" stroke="${p.color}" stroke-dasharray="${2*Math.PI*48}" stroke-dashoffset="${2*Math.PI*48*(1-rate)}"/>
          </svg>
          <div class="ring-text"><div><div class="ring-num">${Math.round(rate*100)}%</div><div class="ring-lbl">完成率</div></div></div>
        </div>
        <div class="ring-info">
          <div class="ring-info-row"><span>总任务</span><span>${total}</span></div>
          <div class="ring-info-row"><span>已完成</span><span>${done}</span></div>
          <div class="ring-info-row"><span>待办</span><span>${total - done}</span></div>
          <div class="ring-info-row"><span>笔记数</span><span>${DB.notes.filter(n=>n.pid===currentPid).length}</span></div>
        </div>
      </div>
    </div>
    <div class="chart-card">
      <div class="chart-title">优先级分布</div>
      <div class="chart-desc">当前待办任务按优先级</div>
      ${[{'k':'high','l':'高优先级','c':'var(--accent)'},{'k':'mid','l':'中优先级','c':'var(--warning)'},{'k':'low','l':'低优先级','c':'var(--success)'}].map(r => `
        <div style="margin-bottom:12px;">
          <div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px;"><span>${r.l}</span><span style="font-weight:600;">${dist[r.k]}</span></div>
          <div style="height:8px;background:var(--surface-2);border-radius:4px;overflow:hidden;"><div style="height:100%;width:${dist[r.k]/maxPri*100}%;background:${r.c};border-radius:4px;transition:width .5s;"></div></div>
        </div>`).join('') || '<div style="color:var(--muted);font-size:13px;text-align:center;padding:16px;">没有待办任务</div>'}
    </div>
  `;
}

// 全局 ObjectURL 注册表：统一管理 createObjectURL 的生命周期，避免内存泄漏
window._pendingObjectURLs = window._pendingObjectURLs || [];
const trackObjectURL = (obj) => { window._pendingObjectURLs.push(obj); return obj; };
const revokePendingObjectURLs = () => {
  (window._pendingObjectURLs || []).forEach(u => { try { URL.revokeObjectURL(u); } catch(e){} });
  window._pendingObjectURLs = [];
};
function openModal(html) {
  // 双击防护：若弹窗已显示则不再重复打开（避免回调丢失）
  if ($('#modalMask').classList.contains('show')) return;
  $('#modal').innerHTML = '<div class="modal-grip"></div>' + html; $('#modalMask').classList.add('show');
}
function closeModal() {
  // 关闭前停止所有视频/音频播放
  const modal = $('#modal');
  if (modal) {
    // 释放本地视频的 ObjectURL
    modal.querySelectorAll('video[data-obj-url]').forEach(v => {
      try { URL.revokeObjectURL(v.dataset.objUrl); } catch(e){}
    });
    // 释放弹窗内图片预览的 ObjectURL（任务图片附件等）
    modal.querySelectorAll('img[data-obj-url]').forEach(img => {
      try { URL.revokeObjectURL(img.dataset.objUrl); } catch(e){}
    });
    // 暂停原生 video/audio
    modal.querySelectorAll('video').forEach(v => { try { v.pause(); v.src = ''; } catch(e){} });
    modal.querySelectorAll('audio').forEach(a => { try { a.pause(); } catch(e){} });
    // 清空 iframe（B站/YouTube等）- 这是停止嵌入视频声音的最可靠方式
    modal.querySelectorAll('iframe').forEach(f => { f.src = ''; });
  }
  // 释放所有挂起的 ObjectURL（面板内预览、导出日历等）
  revokePendingObjectURLs();
  $('#modalMask').classList.remove('show');
}
$('#modalMask').addEventListener('click', e => { if (e.target === e.currentTarget) closeModal(); });

    <div class="field">
      <label class="field-label">提醒（可选）</label>
      <div class="remind-pick" id="mTaskRemindPick">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9M13.73 21a2 2 0 0 1-3.46 0"/></svg>
        <span id="mTaskRemindText">不提醒</span>
      </div>
      <input type="datetime-local" id="mTaskRemindInput" style="display:none;" />
      <div class="remind-quick-btns" id="mTaskRemindQuick">
        <button type="button" class="remind-quick-btn" data-min="30">30分钟后</button>
        <button type="button" class="remind-quick-btn" data-min="60">1小时后</button>
        <button type="button" class="remind-quick-btn" data-min="180">3小时后</button>
        <button type="button" class="remind-quick-btn" data-min="1440">明天此时</button>
        <button type="button" class="remind-quick-btn" data-min="0">自定义</button>
        <button type="button" class="remind-quick-btn" data-min="-1">清除</button>
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal()">取消</button>
      <button class="btn btn-primary" id="mTaskSave">${isEdit ? '保存' : '添加'}</button>
    </div>
  `);
  
  // 渲染已有图片预览
  const renderImagePreviews = () => {
    const grid = $('#mTaskImgPreviewGrid');
    if (existingImages.length === 0 && pendingImgFiles.length === 0) {
      grid.style.display = 'none';
      grid.innerHTML = '';
      return;
    }
    grid.style.display = 'grid';
    grid.innerHTML = [
      ...existingImages.map((img, idx) => `
        <div style="position:relative;">
          <img src="${img}" style="width:100%;aspect-ratio:1;object-fit:cover;border-radius:6px;" />
          <button class="img-remove-btn" data-type="existing" data-idx="${idx}" style="position:absolute;top:-4px;right:-4px;width:20px;height:20px;border-radius:50%;background:var(--danger);color:#fff;border:none;cursor:pointer;font-size:12px;display:grid;place-items:center;">×</button>
        </div>
      `),
      ...pendingImgFiles.map((url, idx) => `
        <div style="position:relative;">
          <img src="${url}" style="width:100%;aspect-ratio:1;object-fit:cover;border-radius:6px;" />
          <button class="img-remove-btn" data-type="pending" data-idx="${idx}" style="position:absolute;top:-4px;right:-4px;width:20px;height:20px;border-radius:50%;background:var(--danger);color:#fff;border:none;cursor:pointer;font-size:12px;display:grid;place-items:center;">×</button>
        </div>
      `)
    ].join('');
    
    grid.querySelectorAll('.img-remove-btn').forEach(btn => {
      btn.onclick = () => {
        const type = btn.dataset.type;
        const idx = parseInt(btn.dataset.idx);
        if (type === 'existing') existingImages.splice(idx, 1);
        else pendingImgFiles.splice(idx, 1);
        renderImagePreviews();
      };
    });
  };
  
  if (existingImages.length > 0) renderImagePreviews();
  
  $$('#mTaskPri .tag-opt').forEach(b => b.addEventListener('click', () => {
    $$('#mTaskPri .tag-opt').forEach(x => x.classList.remove('sel')); b.classList.add('sel'); pri = b.dataset.v;
  }));
  
  // 提醒时间选择
  let remindAt = isEdit && existingTask.remindAt ? existingTask.remindAt : null;
  const remindPick = $('#mTaskRemindPick');
  const remindInput = $('#mTaskRemindInput');
  const remindText = $('#mTaskRemindText');
  const setRemind = (ts) => {
    remindAt = ts;
    if (ts) {
      const d = new Date(ts);
      remindText.textContent = `${d.getMonth()+1}月${d.getDate()}日 ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
      remindPick.classList.add('has-remind');
    } else {
      remindText.textContent = '不提醒';
      remindPick.classList.remove('has-remind');
    }
  };
  remindPick.onclick = () => remindInput.click();
  remindInput.onchange = (e) => {
    if (e.target.value) setRemind(new Date(e.target.value).getTime());
  };
  $$('#mTaskRemindQuick .remind-quick-btn').forEach(btn => {
    btn.onclick = () => {
      const min = +btn.dataset.min;
      if (min === -1) { setRemind(null); remindInput.value=''; return; }
      if (min === 0) { remindInput.click(); return; }
      setRemind(Date.now() + min * 60 * 1000);
    };
  });
  
  // 图片上传（支持多张）
  const imgPick = $('#mTaskImgPick');
  const imgFile = $('#mTaskImgFile');
  const imgText = $('#mTaskImgText');
  imgPick.onclick = () => imgFile.click();
  imgFile.onchange = async (e) => {
    const files = Array.from(e.target.files);
    for (const file of files) {
      if (file.size > 10 * 1024 * 1024) { toast(`${file.name} 超过 10MB，已跳过`); continue; }
      const reader = new FileReader();
      reader.onload = (ev) => {
        pendingImgFiles.push(ev.target.result);
        if (pendingImgFiles.length === 1) renderImagePreviews();
        else {
          // 重新渲染以添加新图片
          const grid = $('#mTaskImgPreviewGrid');
          grid.style.display = 'grid';
          grid.innerHTML = [
            ...existingImages.map((img, idx) => `
              <div style="position:relative;">
                <img src="${img}" style="width:100%;aspect-ratio:1;object-fit:cover;border-radius:6px;" />
                <button class="img-remove-btn" data-type="existing" data-idx="${idx}" style="position:absolute;top:-4px;right:-4px;width:20px;height:20px;border-radius:50%;background:var(--danger);color:#fff;border:none;cursor:pointer;font-size:12px;display:grid;place-items:center;">×</button>
              </div>
            `),
            ...pendingImgFiles.map((url, idx) => `
              <div style="position:relative;">
                <img src="${url}" style="width:100%;aspect-ratio:1;object-fit:cover;border-radius:6px;" />
                <button class="img-remove-btn" data-type="pending" data-idx="${idx}" style="position:absolute;top:-4px;right:-4px;width:20px;height:20px;border-radius:50%;background:var(--danger);color:#fff;border:none;cursor:pointer;font-size:12px;display:grid;place-items:center;">×</button>
              </div>
            `)
          ].join('');
          grid.querySelectorAll('.img-remove-btn').forEach(btn => {
            btn.onclick = () => {
              const type = btn.dataset.type;
              const idx = parseInt(btn.dataset.idx);
              if (type === 'existing') existingImages.splice(idx, 1);
              else pendingImgFiles.splice(idx, 1);
              renderImagePreviews();
            };
          });
        }
      };
      reader.readAsDataURL(file);
    }
    imgText.textContent = `已选 ${pendingImgFiles.length + existingImages.length} 张图片`;
    imgPick.classList.add('has-img');
  };
  
  $('#mTaskText').focus();
  
  $('#mTaskSave').addEventListener('click', async () => {
    const text = $('#mTaskText').value.trim();
    const detail = $('#mTaskDetail').value.trim();
    if (!text) { toast('请输入任务标题'); return; }
    
    // 合并图片（existing + pending）
    const allImages = [...existingImages, ...pendingImgFiles];
    
    if (isEdit) {
      existingTask.text = text;
      existingTask.detail = detail;
      existingTask.pri = pri;
      existingTask.images = allImages;
      existingTask.remindAt = remindAt;
      DB.save();
      closeModal();
      renderAll();
      toast('任务已更新');
    } else {
      const newTask = {
        id: uid(),
        pid: currentPid,
        text,
        detail,
        pri,
        images: allImages,
        remindAt,
        done: false,
        ts: Date.now()
      };
      DB.tasks.push(newTask);
      DB.save();
      closeModal();
      renderAll();
      toast('任务已添加');
      celebrate('✅', '任务已创建');
    }
  });
}

function openTaskImageViewer(images, startIdx) {

/* ===== 数据导出/导入 ===== */
function exportData() {
  const data = {
    projects: DB.projects,
    tasks: DB.tasks,
    notes: DB.notes,
    records: DB.records,
    travelRecords: DB.travelRecords,
    movieRecords: DB.movieRecords,
    goodsRecords: DB.goodsRecords,
    genericRecords: DB.genericRecords,
    exportTime: new Date().toISOString(),
    version: 2
  };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const url = trackObjectURL(URL.createObjectURL(blob));
  const a = document.createElement('a');
  a.href = url;
  const d = new Date();
  a.download = `逐行_${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => { try { URL.revokeObjectURL(url); } catch(e){} }, 1500);
  toast('已导出');
}

// 数据迁移框架：按 version 号顺序执行增量迁移，确保旧备份导入后字段完整
function migrateData(data) {
  const CUR_VER = 2;
  let v = data.version || 1;
  // 确保所有数组字段存在（防止 undefined 调用方法报错）
  const ensureArr = (key) => { if (!Array.isArray(data[key])) data[key] = []; };
  ['projects','tasks','notes','records','travelRecords','movieRecords','goodsRecords','genericRecords'].forEach(ensureArr);
  // v1 → v2：规范任务优先级为字符串
  if (v < 2) {
    data.tasks.forEach(t => { t.pri = normPri(t.pri); });
    v = 2;
  }
  // 未来 v2 → v3、v3 → v4 ... 在此追加
  data.version = CUR_VER;
  return data;
}

function importData() {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = '.json';
  input.onchange = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      try {
        const data = migrateData(JSON.parse(ev.target.result));
        if (!data.projects || !Array.isArray(data.projects)) throw new Error('格式错误');
        const extra = (data.travelRecords?.length || 0) + (data.movieRecords?.length || 0) + (data.goodsRecords?.length || 0) + (data.genericRecords?.length || 0);
        openModal(`
          <div class="modal-title">导入数据</div>
          <div style="font-size:14px;color:var(--ink-2);line-height:1.6;margin-bottom:16px;">
            检测到 <b style="color:var(--ink);">${data.projects.length}</b> 个项目、
            <b style="color:var(--ink);">${data.tasks.length}</b> 个任务、
            <b style="color:var(--ink);">${data.notes.length}</b> 条笔记
            ${extra ? `、<b style="color:var(--ink);">${extra}</b> 条专属记录` : ''}。<br>
            请选择导入方式：
          </div>
          <div style="font-size:12px;color:var(--muted);margin-bottom:14px;line-height:1.6;">
            <b style="color:var(--danger);">覆盖</b>：用备份数据完全替换当前数据<br>
            <b style="color:var(--success);">合并</b>：按 id 去重，同 id 保留较新（ts 更大）的那条
          </div>
          <div class="modal-actions">
            <button class="btn btn-ghost" onclick="closeModal()">取消</button>
            <button class="btn btn-primary" id="confirmImportMerge" style="background:var(--success);">合并</button>
            <button class="btn btn-primary" id="confirmImport" style="background:var(--danger);">覆盖</button>
          </div>
        `);
        // 覆盖模式
        $('#confirmImport').onclick = () => {
          DB.projects = data.projects;
          DB.tasks = data.tasks;
          DB.notes = data.notes;
          DB.records = data.records || [];
          DB.travelRecords = data.travelRecords || [];
          DB.movieRecords = data.movieRecords || [];
          DB.goodsRecords = data.goodsRecords || [];
          DB.genericRecords = data.genericRecords || [];
          DB.save();
          closeModal();
          showDashboard();
          renderAll();
          toast('导入成功（覆盖）');
        };
        // 合并模式：按 id 去重，保留 ts 较新的
        $('#confirmImportMerge').onclick = () => {
          const KEYS = ['projects','tasks','notes','records','travelRecords','movieRecords','goodsRecords','genericRecords'];
          KEYS.forEach(k => {
            const incoming = data[k] || [];
            const existMap = new Map(DB[k].map(x => [x.id, x]));
            incoming.forEach(item => {
              const cur = existMap.get(item.id);
              if (!cur) { existMap.set(item.id, item); }
              else if ((item.ts || 0) > (cur.ts || 0)) { existMap.set(item.id, item); }
            });
            DB[k] = Array.from(existMap.values());
          });
          DB.save();
          closeModal();
          showDashboard();
          renderAll();
          toast('导入成功（合并）');
        };
      } catch (err) {
        toast('文件格式错误');
      }
    };
    reader.readAsText(file);
  };
  input.click();
}

  { name: '麦田', color: '#C99A2E' },

  { name: '湖蓝', color: '#3D7BA8' },
  { name: '玫瑰', color: '#B5453B' },

function applyThemeColor(color) {
  document.documentElement.style.setProperty('--accent', color);
  // 根据主色计算深色版本
  const dark = shadeColor(color, -25);
  document.documentElement.style.setProperty('--accent-ink', dark);
  // 计算浅色版本
  const light = shadeColor(color, 75);
  document.documentElement.style.setProperty('--accent-soft', light);
  // 更新 PWA theme-color
  document.querySelector('meta[name="theme-color"]')?.setAttribute('content', color);
}

function shadeColor(hex, percent) {
  const num = parseInt(hex.replace('#',''), 16);
  const r = Math.min(255, Math.max(0, (num >> 16) + percent * 2.55));
  const g = Math.min(255, Math.max(0, ((num >> 8) & 0x00FF) + percent * 2.55));
  const b = Math.min(255, Math.max(0, (num & 0x0000FF) + percent * 2.55));
  return `rgb(${Math.round(r)},${Math.round(g)},${Math.round(b)})`;
}

/* ===== 任务滑动手势 ===== */
function setupTaskSwipe() {
  const SWIPE_THRESHOLD = 50;

  document.addEventListener('touchstart', (e) => {
    const item = e.target.closest('.task-item');
    if (!item) return;
    const wrap = item.closest('.task-wrap') || item;
    wrap._touchStartX = e.touches[0].clientX;
    wrap._touchStartY = e.touches[0].clientY;
    wrap._startTransform = 0;
    // 计算当前 transform
    const style = getComputedStyle(item);
    const tx = style.transform;
    if (tx && tx !== 'none') {
      const match = tx.match(/matrix\(([^)]+)\)/);
      if (match) wrap._startTransform = parseFloat(match[1].split(',')[4]) || 0;
    }
  }, { passive: true });

  document.addEventListener('touchmove', (e) => {
    const item = e.target.closest('.task-item');
    if (!item) return;
    const wrap = item.closest('.task-wrap') || item;
    if (wrap._touchStartX === undefined) return;
    const dx = e.touches[0].clientX - wrap._touchStartX;
    const dy = e.touches[0].clientY - wrap._touchStartY;
    // 垂直滑动不触发
    if (Math.abs(dy) > Math.abs(dx)) return;
    const delta = dx + (wrap._startTransform || 0);
    // 限制范围
    const clamped = Math.max(-160, Math.min(160, delta));
    item.style.transform = `translateX(${clamped}px)`;
    item.style.transition = 'none';
  }, { passive: true });

  document.addEventListener('touchend', (e) => {
    const item = e.target.closest('.task-item');
    if (!item) return;
    const wrap = item.closest('.task-wrap') || item;
    if (wrap._touchStartX === undefined) return;
    const dx = (wrap._endX || 0) - wrap._touchStartX;
    // 读取当前位移
    const style = getComputedStyle(item);
    const tx = style.transform;
    let currentX = 0;
    if (tx && tx !== 'none') {
      const match = tx.match(/matrix\(([^)]+)\)/);
      if (match) currentX = parseFloat(match[1].split(',')[4]) || 0;
    }

    item.style.transition = '';

    if (currentX < -SWIPE_THRESHOLD) {
      // 左滑 -> 完成
      item.style.transform = 'translateX(-144px)';
      wrap.classList.add('swiped-left');
      const id = +item.dataset.id;
      const t = DB.tasks.find(x => x.id === id);
      if (t && !t.done) {
        t.done = true; t.doneTs = Date.now();
        DB.save();
        toast('已完成');
        checkStreak();
        celebrate('🎯', '任务完成！');
        setTimeout(() => { renderAll(); }, 400);
      }
    } else if (currentX > SWIPE_THRESHOLD) {
      // 右滑 -> 删除
      item.style.transform = 'translateX(144px)';
      wrap.classList.add('swiped-right');
      const id = +item.dataset.id;
      toast('已删除');
      setTimeout(() => {
        DB.tasks = DB.tasks.filter(x => x.id !== id);
        DB.save();
        renderAll();
      }, 300);
    } else {
      item.style.transform = '';
    }

    delete wrap._touchStartX;
    delete wrap._touchStartY;
  });

  // 阻止滑动时点击
  document.addEventListener('click', (e) => {
    const item = e.target.closest('.task-item');
    if (!item) return;
    const wrap = item.closest('.task-wrap') || item;
    const style = getComputedStyle(item);
    const tx = style.transform;
    if (tx && tx !== 'none') {
      const match = tx.match(/matrix\(([^)]+)\)/);
      if (match) {
        const x = parseFloat(match[1].split(',')[4]) || 0;
        if (Math.abs(x) > 10) {
          e.preventDefault();
          item.style.transform = '';
          wrap.classList.remove('swiped-left', 'swiped-right');
        }
      }
    }
  }, true);
}

/* ===== 连续打卡 & 庆祝 ===== */
function getStreakDays() {
  const today = new Date(); today.setHours(0,0,0,0);
  const yesterday = new Date(today); yesterday.setDate(today.getDate() - 1);

  // 计算连续完成的天数
  let streak = 0;
  const d = new Date(today);
  while (true) {
    const dayStr = dateStrOf(d);
    const dayTasks = DB.tasks.filter(t => {
      if (!t.done || !t.doneTs) return false;
      const td = new Date(t.doneTs); td.setHours(0,0,0,0);
      return td.getTime() === d.getTime();
    });
    // 当天完成了至少1个任务就算打卡
    const hasActivity = dayTasks.length > 0 ||
      DB.records.some(r => r.date === dayStr) ||
      DB.notes.some(n => { const nd = new Date(n.ts); nd.setHours(0,0,0,0); return nd.getTime() === d.getTime(); });

    if (hasActivity) {
      streak++;
      d.setDate(d.getDate() - 1);
    } else {
      break;
    }
    if (streak > 365) break;
  }
  return streak;
}

function checkStreak() {
  const streak = getStreakDays();
  if (streak >= 2) {
    const badge = $('#streakBadge');
    if (badge) {
      badge.textContent = `🔥 连续打卡 ${streak} 天`;
      badge.classList.add('show');
      // 存一下 streak 数
      localStorage.setItem('wb_streak', streak);
    }
  }
}

  const overlay = $('#celebrateOverlay');
  $('#celebrateEmoji').textContent = emoji;
  $('#celebrateText').textContent = text;
  overlay.classList.add('show');
  if (navigator.vibrate) navigator.vibrate([50, 30, 50]);
  setTimeout(() => {
    overlay.classList.remove('show');
  }, 1500);
}

const AI = {
  config: JSON.parse(localStorage.getItem('wb_ai_config') || '{"provider":"openai","model":"","apiKey":""}'),
  history: [],
  maxHistory: 20,

  // 快捷提示词
  quickPrompts: [
    { label: '📊 数据分析', prompt: '分析我本周的训练和任务完成情况，给出改进建议' },
    { label: '💪 健身建议', prompt: '根据我的健身记录，帮我制定下周的训练计划' },
    { label: '📋 任务分解', prompt: '帮我分解当前待办任务，制定执行步骤' },
    { label: '💡 学习方法', prompt: '针对我的学习项目，推荐高效的备考方法' }
  ],

  saveConfig() {
    localStorage.setItem('wb_ai_config', JSON.stringify(this.config));
  },

  // 构建上下文数据（供AI分析）
  buildContext() {
    const today = new Date();
    const week = ['日','一','二','三','四','五','六'];
    const allTasks = DB.tasks;
    const todo = allTasks.filter(t => !t.done);
    const done = allTasks.filter(t => t.done);

    // 本周统计
    const now = new Date();
    const day = now.getDay() || 7;
    const monday = new Date(now);
    monday.setDate(now.getDate() - day + 1);
    monday.setHours(0,0,0,0);
    const weekDays = [];
    for (let i = 0; i < 7; i++) {
      const d = new Date(monday);
      d.setDate(monday.getDate() + i);
      weekDays.push(d.toISOString().split('T')[0]);
    }
    const weekRecs = DB.records.filter(r => r.date >= weekDays[0] && r.date <= weekDays[6]);
    const trainDays = new Set(weekRecs.map(r => r.date)).size;
    const weekDone = DB.tasks.filter(t => t.done && new Date(t.ts) >= monday).length;
    const weekNotes = DB.notes.filter(n => new Date(n.ts) >= monday).length;

    return {
      date: `${today.getMonth()+1}月${today.getDate()}日 周${week[today.getDay()]}`,
      stats: {
        totalTasks: allTasks.length,
        todoTasks: todo.length,
        doneTasks: done.length,
        trainDays,
        weekDone,
        weekNotes,
        projects: DB.projects.length
      },
      projects: DB.projects.map(p => ({
        name: p.name,
        module: p.module,
        taskCount: DB.tasks.filter(t => t.pid === p.id).length,
        todoCount: DB.tasks.filter(t => t.pid === p.id && !t.done).length
      })),
      recentRecords: DB.records.slice(-5).map(r => ({
        date: r.date,
        diet: r.diet ? '有记录' : '无',
        training: r.training ? '有训练' : '无'
      }))
    };
  },

  // 渲染消息
  renderMsg(role, content) {
    const div = document.createElement('div');
    div.className = `ai-msg ${role}`;
    if (content === '...loading...') {
      div.className += ' loading';
      div.textContent = '正在思考';
    } else {
      div.innerHTML = this.formatContent(content);
    }
    return div;
  },

  // 格式化内容（简单的Markdown渲染 + 动作解析）
  formatContent(text) {
    // 提取动作块（独立容错：解析失败时降级为纯文本提示，不中断渲染）
    const actionRegex = /\[ACTION\](\{[\s\S]*?\})\[\/ACTION\]/g;
    const actions = [];
    const failedActions = [];
    let cleanText = text;
    let match;
    while ((match = actionRegex.exec(text)) !== null) {
      try {
        const action = JSON.parse(match[1]);
        actions.push(action);
      } catch (e) {
        // 解析失败：记录并在末尾降级提示，避免用户困惑
        failedActions.push(match[1]);
      }
      cleanText = cleanText.replace(match[0], '');
    }

    let html = cleanText
      .replace(/```(\w*)\n([\s\S]*?)```/g, '<pre><code>$2</code></pre>')
      .replace(/`([^`]+)`/g, '<code style="background:rgba(0,0,0,0.06);padding:2px 4px;border-radius:3px;">$1</code>')
      .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
      .replace(/\n/g, '<br>')
      .trim();

    // 附加可执行动作卡片
    if (actions.length > 0) {
      html += '<div class="ai-actions">' + actions.map((a, i) => {
        // 规范化优先级为字符串 high/mid/low
        if (a.type === 'add_task' && a.priority) {
          const priMap = { 0: 'high', 1: 'mid', 2: 'low', high: 'high', mid: 'mid', low: 'low' };
          a.priority = priMap[a.priority] || 'mid';
        }
        const data = encodeURIComponent(JSON.stringify(a));
        if (a.type === 'add_task') {
          const priLabel = a.priority === 'high' ? '高优先' : a.priority === 'low' ? '低优先' : '中优先';
          const priColor = a.priority === 'high' ? 'var(--danger)' : a.priority === 'low' ? 'var(--muted)' : 'var(--warning)';
          return `<div class="ai-action-card ai-action-task" data-action="${data}">
            <div class="ai-action-icon">📋</div>
            <div class="ai-action-body">
              <div class="ai-action-title">${escapeHTML(a.text)}</div>
              <div class="ai-action-meta">
                ${a.project ? `<span class="ai-action-tag">${escapeHTML(a.project)}</span>` : ''}
                <span class="ai-action-tag" style="background:${priColor}20;color:${priColor};">${priLabel}</span>
              </div>
            </div>
            <button class="ai-action-btn">添加</button>
          </div>`;
        } else if (a.type === 'add_tasks') {
          return `<div class="ai-action-card ai-action-tasks" data-action="${data}">
            <div class="ai-action-icon">📚</div>
            <div class="ai-action-body">
              <div class="ai-action-title">批量添加 ${a.tasks.length} 个任务</div>
              <div class="ai-action-list">${a.tasks.map(t => `<div class="ai-action-sub">• ${escapeHTML(t.text)}</div>`).join('')}</div>
            </div>
            <button class="ai-action-btn">全部添加</button>
          </div>`;
        } else if (a.type === 'add_note') {
          return `<div class="ai-action-card ai-action-note" data-action="${data}">
            <div class="ai-action-icon">📝</div>
            <div class="ai-action-body">
              <div class="ai-action-title">${escapeHTML(a.title)}</div>
              <div class="ai-action-preview">${escapeHTML((a.content || '').slice(0, 60))}${a.content && a.content.length > 60 ? '...' : ''}</div>
            </div>
            <button class="ai-action-btn">保存</button>
          </div>`;
        }
        return '';
      }).join('') + '</div>';
    }
    // 解析失败的动作块降级提示
    if (failedActions.length > 0) {
      html += `<div style="margin-top:8px;padding:8px 10px;background:rgba(231,76,60,0.08);border-left:3px solid var(--danger);border-radius:0 6px 6px 0;font-size:12px;color:var(--danger);">⚠️ 有 ${failedActions.length} 个动作块格式异常，已忽略。可能是 AI 返回格式问题。</div>`;
    }

    return html;
  },

  // 执行 AI 动作
  execAction(actionData) {
    try {
      const a = typeof actionData === 'string' ? (() => { try { return JSON.parse(actionData); } catch(e) { toast('动作数据格式异常'); return null; } })() : actionData;
      if (!a) return;
      if (a.type === 'add_task') {
        // 查找项目
        let proj = DB.projects.find(p => p.name === a.project || p.name.includes(a.project || ''));
        if (!proj) proj = DB.projects[0];
        if (!proj) { toast('请先创建项目'); return; }
        const newTask = {
          id: Date.now(),
          pid: proj.id,
          text: a.text,
          done: false,
          pri: a.priority === 'high' ? 'high' : a.priority === 'low' ? 'low' : 'mid',
          ts: Date.now()
        };
        DB.tasks.push(newTask);
        DB.save();
        renderAll();
        toast(`已添加到「${proj.name}」`);
        celebrate('✅', '任务已创建');
      } else if (a.type === 'add_tasks') {
        let proj = DB.projects.find(p => p.name === a.project || p.name.includes(a.project || ''));
        if (!proj) proj = DB.projects[0];
        if (!proj) { toast('请先创建项目'); return; }
        a.tasks.forEach((t, i) => {
          DB.tasks.push({
            id: Date.now() + i,
            pid: proj.id,
            text: t.text,
            done: false,
            pri: t.priority === 'high' ? 'high' : t.priority === 'low' ? 'low' : 'mid',
            ts: Date.now() + i
          });
        });
        DB.save();
        renderAll();
        toast(`已添加 ${a.tasks.length} 个任务到「${proj.name}」`);
        celebrate('📚', `${a.tasks.length} 个任务已创建`);
      } else if (a.type === 'add_note') {
        let proj = DB.projects.find(p => p.name === a.project);
        if (!proj) proj = DB.projects[0];
        if (!proj) { toast('请先创建项目'); return; }
        DB.notes.push({
          id: Date.now(),
          pid: proj.id,
          title: a.title,
          content: a.content || '',
          ts: Date.now()
        });
        DB.save();
        renderAll();
        toast('笔记已保存');
        celebrate('📝', '笔记已创建');
      }
    } catch (e) {
      toast('动作执行失败');
      console.error(e);
    }
  },

  // 添加消息到历史
  addMessage(role, content) {
    this.history.push({ role, content, ts: Date.now() });
    if (this.history.length > this.maxHistory) {
      this.history = this.history.slice(-this.maxHistory);
    }
    localStorage.setItem('wb_ai_history', JSON.stringify(this.history));
  },

  // 发送消息
  async send(userMessage) {
    if (!this.config.apiKey) {
      return '请先配置 API Key（点击右上角齿轮图标）';
    }

当前数据上下文（${context.date}）：

项目列表：
${context.projects.map(p => `- ${p.module ? `[${p.module}] ` : ''}${p.name}：${p.taskCount} 个任务（${p.todoCount} 个待办）`).join('\n')}

最近训练记录：

【重要能力：可执行动作】
当用户让你创建任务、制定计划、分解目标时，你可以在回复中嵌入特殊动作块，用户点击即可一键执行。格式如下：

1. 创建单个任务：
[ACTION]{"type":"add_task","text":"任务内容","priority":"high|medium|low","project":"项目名称"}[/ACTION]

2. 批量创建任务（用于制定计划、分解目标）：
[ACTION]{"type":"add_tasks","project":"项目名称","tasks":[{"text":"任务1","priority":"medium"},{"text":"任务2","priority":"high"}]}[/ACTION]

3. 创建笔记：
[ACTION]{"type":"add_note","title":"笔记标题","content":"笔记内容","project":"项目名称"}[/ACTION]

规则：
- project 必须是上述项目列表中的名称，如果用户未指定则使用最相关的项目
- priority：high=高优先（紧急），medium=中优先，low=低优先
- 动作块要放在回复的最后，前面先用自然语言说明你的建议
- 可以同时输出多个动作块
- 动作块必须严格使用上述 JSON 格式，不要添加额外字段

示例：
用户：帮我制定一个本周健身计划
助手：好的，根据你的情况，我建议本周这样安排：
- 周一/三/五：力量训练
- 周二/四：有氧运动
- 周末：休息或轻度活动

下面是一键添加的 plan：
[ACTION]{"type":"add_tasks","project":"健身计划","tasks":[{"text":"周一：深蹲4组×12次+硬拉4组×10次","priority":"high"},{"text":"周二：慢跑30分钟","priority":"medium"},{"text":"周三：卧推4组×10次+引体向上4组×8次","priority":"high"},{"text":"周四：HIIT 20分钟","priority":"medium"},{"text":"周五：肩推4组×12次+划船4组×10次","priority":"high"}]}[/ACTION]

请根据用户问题，结合上述数据给出个性化建议。回复要简洁实用，避免冗长。`;

    const messages = [
      { role: 'system', content: systemPrompt },
      ...this.history.slice(-10).map(m => ({ role: m.role, content: m.content }))
    ];

    try {
      const response = await fetch('https://api.openai.com/v1/chat/completions', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${this.config.apiKey}`
        },
        body: JSON.stringify({
          model: this.config.model || 'gpt-3.5-turbo',
          messages,
          temperature: 0.7,
          max_tokens: 1000
        })
      });

      if (!response.ok) {
        const err = await response.json();
        throw new Error(err.error?.message || 'API 调用失败');
      }

      const data = await response.json();
      const aiMessage = data.choices[0].message.content;
      this.addMessage('assistant', aiMessage);
      return aiMessage;
    } catch (err) {
      console.error('AI Error:', err);
      return `❌ 调用失败：${err.message}\n\n请检查：\n1. API Key 是否正确\n2. 模型名称是否支持\n3. 网络连接是否正常`;
    }
  },

  // 显示配置弹层
  showConfig() {
    const modal = $('#modal');
    modal.innerHTML = `
      <div class="ai-config-panel">
        <div class="ai-config-title">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
          AI 助手配置
        </div>
        <div class="ai-config-field">
          <div class="ai-config-label">模型名称</div>
          <input class="ai-config-input" id="aiModelInput" value="${escapeHTML(this.config.model)}" placeholder="例如：gpt-3.5-turbo 或 gpt-4">
          <div class="ai-config-hint">支持 OpenAI API 兼容的模型</div>
        </div>
        <div class="ai-config-field">
          <div class="ai-config-label">API Key</div>
          <input class="ai-config-input" id="aiKeyInput" type="password" value="${escapeHTML(this.config.apiKey)}" placeholder="sk-...">
          <div class="ai-config-hint">密钥仅存储在本地，不会上传服务器</div>
        </div>
        <div class="ai-config-btns">
          <button class="ai-config-btn secondary" id="aiConfigCancel">取消</button>
          <button class="ai-config-btn primary" id="aiConfigSave">保存</button>
        </div>
      </div>
    `;
    $('#modalMask').classList.add('show');

    $('#aiConfigCancel').onclick = () => $('#modalMask').classList.remove('show');
    $('#aiConfigSave').onclick = () => {
      this.config.model = $('#aiModelInput').value.trim();
      this.config.apiKey = $('#aiKeyInput').value.trim();
      this.saveConfig();
      $('#modalMask').classList.remove('show');
      toast('配置已保存');
    };
  },

  // 初始化
  init() {
    // 恢复历史
    const savedHistory = localStorage.getItem('wb_ai_history');
    if (savedHistory) {
      this.history = JSON.parse(savedHistory);
    }

    // 渲染快捷提示词
    const quickList = $('#aiQuickList');
    quickList.innerHTML = this.quickPrompts.map(q =>
      `<button class="ai-quick-item" data-prompt="${escapeHTML(q.prompt)}">${q.label}</button>`
    ).join('');

    // 恢复历史消息
    const body = $('#aiBody');
    if (this.history.length === 0) {
      body.innerHTML = `<div class="ai-msg ai">你好！我是 AI 助手，可以帮你：
<br>• 分析任务和训练数据
<br>• 制定健身饮食计划
<br>• 分解复杂任务
<br>• 提供学习备考建议
<br><br>点击上方快捷按钮或直接输入问题开始对话。</div>`;
    } else {
      this.history.forEach(m => {
        body.appendChild(this.renderMsg(m.role === 'user' ? 'user' : 'ai', m.content));
      });
      // 历史消息中的动作按钮也要绑定
      body.querySelectorAll('.ai-action-card').forEach(card => {
        const btn = card.querySelector('.ai-action-btn');
        if (btn) {
          btn.onclick = (e) => {
            e.stopPropagation();
            const actionData = decodeURIComponent(card.dataset.action);
            this.execAction(actionData);
            card.classList.add('done');
            btn.disabled = true;
            btn.textContent = '已添加';
          };
        }
      });
      body.scrollTop = body.scrollHeight;
    }

    // 绑定事件
    $('#aiFab').onclick = () => {
      const panel = $('#aiPanel');
      const isShow = panel.classList.toggle('show');
      $('#aiFab').setAttribute('aria-expanded', isShow);
      if (isShow) {
        $('#aiInput').focus();
      }
    };

    $('#aiCloseBtn').onclick = () => {
      $('#aiPanel').classList.remove('show');
    };

    $('#aiConfigBtn').onclick = () => this.showConfig();

    $('#aiSend').onclick = () => this.handleSend();

    // 语音输入：长按录音，松开停止
    const voiceBtn = $('#aiVoice');
    const aiInputEl = $('#aiInput');
    const SpeechRecognitionSupported = !!(window.SpeechRecognition || window.webkitSpeechRecognition);
    if (SpeechRecognitionSupported) {
      voiceBtn.title = '长按说话';
      // 触摸事件（手机）
      voiceBtn.addEventListener('touchstart', (e) => { e.preventDefault(); this.startVoice(); }, { passive: false });
      voiceBtn.addEventListener('touchend', (e) => { e.preventDefault(); this.stopVoice(); }, { passive: false });
      voiceBtn.addEventListener('touchcancel', () => this.stopVoice());
      // 鼠标事件（电脑）
      voiceBtn.addEventListener('mousedown', (e) => { e.preventDefault(); this.startVoice(); });
      voiceBtn.addEventListener('mouseup', (e) => { e.preventDefault(); this.stopVoice(); });
      voiceBtn.addEventListener('mouseleave', () => this.stopVoice());
    } else {
      // iOS Safari 等不支持 Web Speech API 的环境：隐藏麦克风按钮，避免误操作
      voiceBtn.style.display = 'none';
      aiInputEl.placeholder = '输入问题...';
    }

    $('#aiInput').onkeydown = (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        this.handleSend();
      }
    };

    // 自动调整输入框高度
    $('#aiInput').oninput = function() {
      this.style.height = 'auto';
      this.style.height = Math.min(this.scrollHeight, 100) + 'px';
    };

    // 快捷提示词点击
    quickList.onclick = (e) => {
      const item = e.target.closest('.ai-quick-item');
      if (item) {
        $('#aiInput').value = item.dataset.prompt;
        this.handleSend();
      }
    };
  },

  // 语音输入：长按录音，松开停止
  startVoice() {
    const voiceBtn = $('#aiVoice');
    const input = $('#aiInput');

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SpeechRecognition) {
      const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
      toast(isIOS ? 'iOS Safari 暂不支持语音输入，请使用键盘输入' : '当前浏览器不支持语音输入，请使用 Chrome 或 Edge');
      return;
    }

    // 如果已在录音，不重复启动
    if (this._isRecording) return;

    const rec = new SpeechRecognition();
    rec.lang = 'zh-CN';
    rec.continuous = true; // 长按期间持续识别
    rec.interimResults = true;

    let finalText = input.value;

    rec.onstart = () => {
      this._isRecording = true;
      voiceBtn.classList.add('recording');
      voiceBtn.title = '松开停止录音';
    };

    rec.onresult = (e) => {
      let interim = '';
      for (let i = e.resultIndex; i < e.results.length; i++) {
        const transcript = e.results[i][0].transcript;
        if (e.results[i].isFinal) {
          finalText += transcript;
        } else {
          interim += transcript;
        }
      }
      input.value = finalText + interim;
      input.style.height = 'auto';
      input.style.height = Math.min(input.scrollHeight, 100) + 'px';
    };

    rec.onerror = (e) => {
      this._isRecording = false;
      voiceBtn.classList.remove('recording');
      voiceBtn.title = '长按说话';
      if (e.error === 'not-allowed') {
        toast('请允许浏览器使用麦克风');
      } else if (e.error !== 'aborted' && e.error !== 'no-speech') {
        toast('语音识别失败：' + e.error);
      }
    };

    rec.onend = () => {
      this._isRecording = false;
      voiceBtn.classList.remove('recording');
      voiceBtn.title = '长按说话';
      input.focus();
    };

    this._recognition = rec;
    rec.start();
  },

  stopVoice() {
    if (this._recognition && this._isRecording) {
      this._recognition.stop();
    }
  },

  async handleSend() {
    const input = $('#aiInput');
    const msg = input.value.trim();
    if (!msg) return;

    const body = $('#aiBody');
    const sendBtn = $('#aiSend');

    // 添加用户消息
    body.appendChild(this.renderMsg('user', msg));
    input.value = '';
    input.style.height = 'auto';

    // 添加加载提示
    const loadingDiv = this.renderMsg('ai', '...loading...');
    body.appendChild(loadingDiv);
    body.scrollTop = body.scrollHeight;

    // 禁用发送按钮
    sendBtn.disabled = true;

    // 调用 AI
    const response = await this.send(msg);

    // 移除加载提示，添加AI回复
    loadingDiv.remove();
    body.appendChild(this.renderMsg('ai', response));
    body.scrollTop = body.scrollHeight;

    // 绑定动作按钮
    body.querySelectorAll('.ai-action-card').forEach(card => {
      const btn = card.querySelector('.ai-action-btn');
      if (btn) {
        btn.onclick = (e) => {
          e.stopPropagation();
          const actionData = decodeURIComponent(card.dataset.action);
          this.execAction(actionData);
          // 标记为已执行
          card.classList.add('done');
          btn.disabled = true;
          btn.textContent = '已添加';
        };
      }
    });

    sendBtn.disabled = false;
  }
};

// 初始化 AI
AI.init();

/* ===== PWA：Service Worker 注册 + 安装提示 ===== */
let deferredPrompt = null;
const INSTALL_DISMISS_KEY = 'wb_install_dismissed';
const installBanner = $('#installBanner');

// 注册 Service Worker（仅 https 或 localhost 生效）
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch((err) => console.warn('SW 注册失败:', err));
  });
}

// 捕获安装提示事件（安卓 Chrome）
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredPrompt = e;
  // 用户未拒绝过才显示
  if (!localStorage.getItem(INSTALL_DISMISS_KEY)) {
    setTimeout(() => installBanner.classList.add('show'), 1500);
  }
});

// 点击安装
$('#installBtn').addEventListener('click', async () => {
  if (deferredPrompt) {
    installBanner.classList.remove('show');
    deferredPrompt.prompt();
    const { outcome } = await deferredPrompt.userChoice;
    if (outcome === 'accepted') toast('已添加到主屏幕');
    deferredPrompt = null;
  } else {
    // iOS 不支持 beforeinstallprompt，引导手动添加
    toast('请用浏览器菜单"添加到主屏幕"');
  }
});

// 关闭提示
$('#installDismiss').addEventListener('click', () => {
  installBanner.classList.remove('show');
  localStorage.setItem(INSTALL_DISMISS_KEY, '1');
});

// 已安装则隐藏
window.addEventListener('appinstalled', () => {
  installBanner.classList.remove('show');
  deferredPrompt = null;
  toast('逐行已安装');
});

// 检测是否已作为 PWA 运行
if (window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone) {
  installBanner.style.display = 'none';
}
</script>
