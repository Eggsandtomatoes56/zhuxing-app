/* ===== 本周统计 ===== */
function getWeekRange() {
  const now = new Date();
  const day = now.getDay() || 7;
  const monday = new Date(now);
  monday.setDate(now.getDate() - day + 1);
  monday.setHours(0,0,0,0);
  return monday;
}
function dateStrOf(d) {
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function renderWeeklyStats() {
  const wrap = $('#weeklyStats');
  if (!wrap) return;
  const monday = getWeekRange();
  const today = new Date(); today.setHours(0,0,0,0);
  const todayStr = dateStrOf(today);
  const weekDays = [];
  for (let i = 0; i < 7; i++) {
    const d = new Date(monday); d.setDate(monday.getDate() + i);
    weekDays.push({ date: dateStrOf(d), ts: d.getTime(), isToday: dateStrOf(d) === todayStr });
  }
  const startTs = monday.getTime();
  const endTs = weekDays[6].ts + 86400000 - 1;
  // 一次性按时间范围过滤本周所有数据（避免 49 次全量遍历）
  const inRange = (ts) => ts >= startTs && ts <= endTs;
  const weekRecs = DB.records.filter(r => r.date >= dateStrOf(monday) && r.date <= weekDays[6].date);
  const weekTasksDone = DB.tasks.filter(t => t.done && inRange(t.ts));
  const weekNotes = DB.notes.filter(n => inRange(n.ts));
  const weekGeneric = DB.genericRecords.filter(r => inRange(r.ts));
  const weekTravel = DB.travelRecords.filter(r => inRange(r.ts));
  const weekMovie = DB.movieRecords.filter(r => inRange(r.ts));
  const weekGoods = DB.goodsRecords.filter(r => inRange(r.ts));
  // 所有有活动的日期集合
  const activeDates = new Set();
  weekRecs.forEach(r => activeDates.add(r.date));
  weekTasksDone.forEach(t => { activeDates.add(dateStrOf(new Date(t.ts))); });
  weekNotes.forEach(n => { activeDates.add(dateStrOf(new Date(n.ts))); });
  weekGeneric.forEach(r => { activeDates.add(dateStrOf(new Date(r.ts))); });
  const activeDays = activeDates.size;
  // 本周完成任务 / 新增笔记
  const weekDone = weekTasksDone.length;
  const weekNotesCount = weekNotes.length;
  // 每日活动量：用 Map 按日期分桶统计，O(n) 一次遍历
  const dayCountMap = new Map();
  weekDays.forEach(wd => dayCountMap.set(wd.date, 0));
  const addToDay = (ts) => { const d = dateStrOf(new Date(ts)); if (dayCountMap.has(d)) dayCountMap.set(d, dayCountMap.get(d) + 1); };
  weekRecs.forEach(r => { if (dayCountMap.has(r.date)) dayCountMap.set(r.date, dayCountMap.get(r.date) + 1); });
  weekTasksDone.forEach(t => addToDay(t.ts));
  weekNotes.forEach(n => addToDay(n.ts));
  weekGeneric.forEach(r => addToDay(r.ts));
  weekTravel.forEach(r => addToDay(r.ts));
  weekMovie.forEach(r => addToDay(r.ts));
  weekGoods.forEach(r => addToDay(r.ts));
  const activity = weekDays.map(wd => ({ ...wd, count: dayCountMap.get(wd.date) }));
  const maxAct = Math.max(1, ...activity.map(a => a.count));
  const dayNames = ['一','二','三','四','五','六','日'];
  const sunDate = new Date(monday); sunDate.setDate(monday.getDate() + 6);
  const range = `${monday.getMonth()+1}/${monday.getDate()} - ${sunDate.getMonth()+1}/${sunDate.getDate()}`;

  // 金色星星徽章：今日高优任务完成>=2 或 今日完成>=4
  const todayTasks = DB.tasks.filter(t => t.done && t.ts >= today.getTime() && t.ts < today.getTime() + 86400000);
  const todayHighDone = todayTasks.filter(t => normPri(t.pri) === 'high').length;
  const todayTotalDone = todayTasks.length;
  const showStar = todayHighDone >= 2 || todayTotalDone >= 4;

  // 本周完成天数（有任务完成的日子）
  const weekDoneDates = new Set();
  weekTasksDone.forEach(t => { weekDoneDates.add(dateStrOf(new Date(t.ts))); });
  const weekDoneDays = weekDoneDates.size;

  wrap.innerHTML = `
    <div class="weekly-head">
      <div class="weekly-title">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
        本周统计
        ${showStar ? `<span style="display:inline-flex;align-items:center;gap:2px;margin-left:6px;font-size:14px;color:#F5A623;" title="今日表现优秀！">⭐</span>` : ''}
      </div>
      <div class="weekly-range">${range}</div>
    </div>
    <div class="weekly-stats">
      <div class="weekly-stat"><div class="weekly-stat-num" style="color:var(--purple);">${activeDays}</div><div class="weekly-stat-lbl">活动天数</div></div>
      <div class="weekly-stat"><div class="weekly-stat-num" style="color:var(--success);">${weekDone}</div><div class="weekly-stat-lbl">完成任务</div></div>
      <div class="weekly-stat"><div class="weekly-stat-num" style="color:var(--warning);">${weekNotesCount}</div><div class="weekly-stat-lbl">新增笔记</div></div>
    </div>
    <div class="weekly-chart">
      ${activity.map((a, idx) => `
        <div class="weekly-bar-col">
          <div class="weekly-bar ${a.isToday?'weekly-bar-today':''}" style="height:${Math.max(6, a.count/maxAct*100)}%; background:${a.count>0?'linear-gradient(180deg, var(--accent), var(--accent-ink))':'rgba(128,120,116,0.15)'};" title="${a.count}项活动"></div>
          <div class="weekly-bar-lbl ${a.isToday?'today':''}">${a.isToday?'今':'周'+dayNames[idx]}</div>
        </div>`).join('')}
    </div>
    <div class="weekly-legend">本周每日活动量（记录 + 任务 + 笔记）${showStar ? ' · 今日⭐' : ''}</div>
  `;
}

// 周日晚上9:30夸奖弹窗（单周一次）
function checkWeeklyPraise() {
  const now = new Date();
  const day = now.getDay(); // 0=周日
  const hour = now.getHours();
  const min = now.getMinutes();
  // 仅周日 21:30 之后触发
  if (day !== 0 || hour < 21 || (hour === 21 && min < 30)) return;

  // 本周完成天数
  const monday = getWeekRange();
  const startTs = monday.getTime();
  const endTs = startTs + 7 * 86400000 - 1;
  const weekDoneDates = new Set();
  DB.tasks.filter(t => t.done && t.ts >= startTs && t.ts <= endTs).forEach(t => {
    weekDoneDates.add(dateStrOf(new Date(t.ts)));
  });
  // 也算有记录的日子
  DB.records.filter(r => r.date >= dateStrOf(monday)).forEach(r => weekDoneDates.add(r.date));
  const doneDays = weekDoneDates.size;

  if (doneDays < 5) return; // 不足5天不弹

  // 单周一次：用本周一的日期字符串作为 key
  const weekKey = 'wb_praise_' + dateStrOf(monday);
  if (localStorage.getItem(weekKey)) return; // 本周已弹过
  localStorage.setItem(weekKey, '1');

  // 弹窗（统一走 openModal，避免与其它弹窗叠加）
  openModal(`
    <div style="max-width:360px;text-align:center;padding:32px 24px;">
      <div style="font-size:48px;margin-bottom:12px;">🎉</div>
      <div style="font-size:18px;font-weight:700;color:var(--ink);margin-bottom:8px;">本周表现超赞！</div>
      <div style="font-size:14px;color:var(--ink-2);line-height:1.6;margin-bottom:20px;">
        辛苦了，适当放松，下周继续冲！<br/>
        <span style="color:var(--muted);font-size:12px;">本周活跃 ${doneDays} 天 · 完成任务 ${DB.tasks.filter(t => t.done && t.ts >= startTs && t.ts <= endTs).length} 项</span>
      </div>
      <button class="btn btn-primary" style="width:100%;" onclick="closeModal();">收到，继续加油！</button>
    </div>
  `);
}

// 获取用户位置：优先GPS定位 → IP定位 → 最终默认
// 手机PWA安装后有定位权限的情况下，优先使用GPS跟随手机定位
async function getUserLocation() {
  const savedCity = localStorage.getItem('wb_weather_city');
  const saved = savedCity ? (() => { try { return JSON.parse(savedCity); } catch(e) { return null; } })() : null;

  // 如果用户手动选择过城市（通过城市选择器），且不是自动定位的结果，优先用手动选的
  // 但如果已选"跟随手机定位"模式，则每次强制GPS
  const forceGps = localStorage.getItem('wb_weather_force_gps') === '1';
  if (saved && !forceGps && saved._manual === true) return saved;

  // 1. GPS高精度定位（手机端跟随手机天气位置）
  if (navigator.geolocation) {
    try {
      const pos = await new Promise((resolve, reject) => {
        // enableHighAccuracy=true 让手机用GPS芯片，跟随系统定位
        navigator.geolocation.getCurrentPosition(resolve, reject, {
          timeout: 8000, maximumAge: 0, enableHighAccuracy: true
        });
      });
      const { latitude: lat, longitude: lon } = pos.coords;
      const name = await reverseGeocode(lat, lon);
      const loc = { lat, lon, name, _manual: forceGps ? false : false };
      localStorage.setItem('wb_weather_city', JSON.stringify(loc));
      return loc;
    } catch(e) {
      // 定位被拒绝/超时：若用户强制要求GPS，直接返回默认并提示
      if (forceGps) {
        toast('定位失败，请开启手机定位权限');
      }
    }
  } else if (forceGps) {
    toast('当前浏览器不支持定位功能');
  }

  // 2. 已有缓存但GPS失败，沿用缓存
  if (saved && saved.lat && saved.lon) return saved;

  // 3. IP定位（file://或无定位权限时）
  try {
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), 3500);
    const resp = await fetch('https://ipapi.co/json/', { signal: ctrl.signal });
    clearTimeout(timer);
    if (resp.ok) {
      const data = await resp.json();
      if (data.latitude && data.longitude) {
        const loc = { lat: data.latitude, lon: data.longitude, name: data.city || data.region || '当前位置', _manual: false };
        localStorage.setItem('wb_weather_city', JSON.stringify(loc));
        return loc;
      }
    }
  } catch(e) {}

  // 4. 默认北京
  return { lat: 39.9042, lon: 116.4074, name: '北京', _manual: false };
}

// 反向地理编码：经纬度 → 城市名
async function reverseGeocode(lat, lon) {
  try {
    const resp = await fetch(`https://nominatim.openstreetmap.org/reverse?lat=${lat}&lon=${lon}&format=json&zoom=10&accept-language=zh-CN`);
    if (resp.ok) {
      const data = await resp.json();
      const addr = data.address || {};
      return addr.city || addr.town || addr.county || addr.state || addr.country || '当前位置';
    }
  } catch(e) {}
  return '当前位置';
}

async function renderRealWeather() {
  const wEl = document.getElementById('weatherInline');
  if (!wEl) return;

  // 立即绑定点击事件——无论什么状态都能点开城市选择器
  wEl.style.cursor = 'pointer';
  wEl.title = '点击更换城市 / 重新定位';
  wEl.onclick = () => openWeatherCityPicker();

  // 缓存：10分钟内不重复请求
  const cacheKey = 'wb_weather_data';
  const cached = localStorage.getItem(cacheKey);
  if (cached) {
    try {
      const data = JSON.parse(cached);
      if (Date.now() - data.ts < 600000) { // 10分钟缓存
        const info = getWmoInfo(data.code);
        const icon = (new Date().getHours() >= 18 || new Date().getHours() < 6) ? info.night : info.icon;
        wEl.innerHTML = `<span>${icon}</span><span>${data.temp}°C ${info.name}</span><span style="color:var(--muted);font-size:12px;">${escapeHTML(data.city)}</span>`;
        return;
      }
    } catch(e) {}
  }

  // 加载中（也能点）
  wEl.innerHTML = `<span style="color:var(--muted);">⏳ 天气加载中...</span>`;

  // 带超时的 fetch 封装
  const fetchWithTimeout = async (url, ms = 8000) => {
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), ms);
    try {
      const resp = await fetch(url, { signal: ctrl.signal });
      return resp;
    } finally { clearTimeout(timer); }
  };

  try {
    const loc = await getUserLocation();
    // 调用 Open-Meteo API（免费、无需Key，支持 CORS）
    const url = `https://api.open-meteo.com/v1/forecast?latitude=${loc.lat}&longitude=${loc.lon}&current=temperature_2m,weather_code&timezone=auto`;
    const resp = await fetchWithTimeout(url, 8000);
    if (!resp.ok) throw new Error('天气API请求失败');
    const data = await resp.json();
    const current = data.current;
    if (!current) throw new Error('无天气数据');

    const code = current.weather_code;
    const temp = Math.round(current.temperature_2m);
    const info = getWmoInfo(code);
    const isNight = new Date().getHours() >= 18 || new Date().getHours() < 6;
    const icon = isNight ? info.night : info.icon;

    // 缓存结果
    localStorage.setItem(cacheKey, JSON.stringify({
      code, temp, city: loc.name, ts: Date.now()
    }));

    wEl.innerHTML = `<span>${icon}</span><span>${temp}°C ${info.name}</span><span style="color:var(--muted);font-size:12px;">${escapeHTML(loc.name)}</span>`;
  } catch(err) {
    // 失败时若已选城市，至少显示城市名 + 提示，而非只显示"获取失败"
    const savedCity = JSON.parse(localStorage.getItem('wb_weather_city') || '{}');
    const cityName = savedCity.name || '';
    const isFileProtocol = location.protocol === 'file:';
    const hint = isFileProtocol ? '本地打开无法联网' : '点击重试';
    wEl.innerHTML = cityName
      ? `<span style="color:var(--muted);">🌡️ ${escapeHTML(cityName)} · ${hint}</span>`
      : `<span style="color:var(--muted);">🌡️ 天气获取失败 · ${hint}</span>`;
  }
}

    if (localMatch.length === 0) {
      try {
        const resp = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(q)}&count=8&language=zh`);
        if (!resp.ok) return;
        const data = await resp.json();
        if (!data.results || data.results.length === 0) {
          resultsDiv.innerHTML = '<div style="color:var(--muted);font-size:13px;padding:8px;">未找到"' + escapeHTML(q) + '"相关城市，请尝试其他关键词</div>';
          return;
        }
        resultsDiv.innerHTML = '<div style="color:var(--muted);font-size:12px;padding:4px 0 8px;">联网搜索结果</div>';
        data.results.forEach(r => {
          const name = r.name + (r.admin1 ? ', '+r.admin1 : '');
          resultsDiv.appendChild(renderCityResult(r.latitude, r.longitude, name));
        });
      } catch(e) {
        resultsDiv.innerHTML = '<div style="color:var(--muted);font-size:13px;padding:8px;">联网搜索不可用，请从常用城市中选择</div>';
      }
    }
  };

  // IP定位按钮
  mask.querySelector('#cityLocateBtn').onclick = async () => {
    const ipBtn = mask.querySelector('#cityLocateBtn');
    ipBtn.innerHTML = '<span style="font-size:16px;">⏳</span> IP定位中...';
    ipBtn.style.opacity = '0.8';
    try {
      const ctrl = new AbortController();
      const timer = setTimeout(() => ctrl.abort(), 5000);
      const resp = await fetch('https://ipapi.co/json/', { signal: ctrl.signal });
      clearTimeout(timer);
      if (resp.ok) {
        const data = await resp.json();
        if (data.latitude && data.longitude) {
          const name = data.city || data.region || '当前位置';
          const loc = { lat: data.latitude, lon: data.longitude, name, _manual: false };
          localStorage.setItem('wb_weather_city', JSON.stringify(loc));
          localStorage.removeItem('wb_weather_data');
          mask.remove();
          renderRealWeather();
          toast(`IP定位到：${name}`);
          return;
        }
      }
      toast('IP定位失败，请手动选择城市');
    } catch(e) {
      toast('IP定位失败，请检查网络或手动选择');
    } finally {
      ipBtn.innerHTML = '<span style="font-size:16px;">🌐</span> IP定位';
      ipBtn.style.opacity = '1';
    }
  };
}

// 项目选择器：弹出让用户选项目

  const mask = document.createElement('div');

  mask.innerHTML = `

    };
  });
}

/* ===== 项目详情渲染 ===== */
function renderProject() {
  const p = DB.projects.find(x => x.id === currentPid);
  if (!p) { showDashboard(); return; }
  // 重建前释放上一次面板内挂起的 ObjectURL（任务图片预览等），避免内存泄漏
  revokePendingObjectURLs();
  const tasks = DB.tasks.filter(t => t.pid === currentPid);
  const done = tasks.filter(t => t.done).length;
  const total = tasks.length;
  const rate = total ? Math.round(done/total*100) : 0;
  const noteCount = DB.notes.filter(n => n.pid === currentPid).length;
  const tabs = getProjectTabs(p);
  const defTab = getDefaultTab(p);

  // 确保当前标签在项目的 tabs 中，否则切换到默认标签
  if (!tabs.includes(projectTab)) projectTab = defTab;

  // 计算记录数（通用）
  let recordCount = 0, recordLabel = '记录';
  const recFn = getRecordRenderer(p);
  if (recFn === renderProjectRecords) { recordCount = DB.records.filter(r => r.pid === currentPid).length; recordLabel = '记录天数'; }
  else if (recFn === renderTravelRecords) { recordCount = DB.travelRecords.filter(r => r.pid === currentPid).length; recordLabel = '旅行次数'; }
  else if (recFn === renderMovieRecords) { recordCount = DB.movieRecords.filter(r => r.pid === currentPid).length; recordLabel = '观影数'; }
  else if (recFn === renderGoodsRecords) { recordCount = DB.goodsRecords.filter(r => r.pid === currentPid).length; recordLabel = '好物数'; }
  else if (recFn === renderGenericRecords) { recordCount = DB.genericRecords.filter(r => r.pid === currentPid).length; recordLabel = '记录数'; }

  // 动态统计头部
  const statItems = [];
  if (tabs.includes('records') || tabs.includes('recipes')) {
    statItems.push(`<div><div class="ph-stat-num">${recordCount || noteCount}</div><div class="ph-stat-lbl">${tabs.includes('recipes')?'菜品数':recordLabel}</div></div>`);
  }
  if (tabs.includes('tasks')) {
    statItems.push(`<div><div class="ph-stat-num">${total - done}</div><div class="ph-stat-lbl">待办</div></div>`);
    statItems.push(`<div><div class="ph-stat-num">${done}</div><div class="ph-stat-lbl">已完成</div></div>`);
  }
  if (tabs.includes('notes') && !tabs.includes('records') && !tabs.includes('recipes')) {
    statItems.push(`<div><div class="ph-stat-num">${noteCount}</div><div class="ph-stat-lbl">笔记</div></div>`);
  }
  statItems.push(`<div><div class="ph-stat-num">${rate}%</div><div class="ph-stat-lbl">完成率</div></div>`);
  const statsHTML = statItems.join('');

  // 动态标签
  const tabsHTML = tabs.map(t => {
    const label = getTabLabel(p, t);
    return `<button class="tab ${projectTab===t?'active':''}" data-tab="${t}">${escapeHTML(label)}</button>`;
  }).join('');
  // 动态面板
  const panelsHTML = tabs.map(t => `<div class="tab-panel ${projectTab===t?'active':''}" id="panel-${t}"></div>`).join('');

  $('#projectContent').innerHTML = `
    <div class="proj-header" style="--ph-color:${p.color}">
      <div class="proj-header-top">
        <div class="proj-header-name"><span class="proj-header-dot" style="background:${p.color}"></span>${escapeHTML(p.name)}</div>
        <div style="display:flex;gap:8px;align-items:center;">
          <span class="proj-header-module">${escapeHTML(p.module)}</span>
          <button class="icon-btn" id="projMenuBtn" title="项目菜单" style="width:30px;height:30px;border-radius:8px;">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><circle cx="12" cy="5" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="12" cy="19" r="1"/></svg>
          </button>
        </div>
      </div>
      <div class="proj-header-desc">${escapeHTML(p.desc || '暂无描述')}</div>
      <div class="proj-header-stats">${statsHTML}</div>
    </div>
    <div class="tabs">${tabsHTML}</div>
    ${panelsHTML}
  `;

  // 标签切换事件
  $$('#projectContent .tab').forEach(t => t.addEventListener('click', () => {
    projectTab = t.dataset.tab;
    $$('#projectContent .tab').forEach(x => x.classList.toggle('active', x === t));
    $$('#projectContent .tab-panel').forEach(x => x.classList.toggle('active', x.id === 'panel-' + projectTab));
    // 切换标签时渲染新激活面板（其它面板按需渲染，避免一次性全量渲染）
    renderActivePanel(projectTab, p);
  }));

  // 项目菜单
  $('#projMenuBtn')?.addEventListener('click', () => openProjectMenu(p));

  // 仅渲染当前激活面板（而非全部面板），减少 DOM 重建与重排
  renderActivePanel(projectTab, p);
}

// 渲染单个面板内容（按需调用，避免全量重建）
function renderActivePanel(tab, p) {
  if (!p) p = DB.projects.find(x => x.id === currentPid);
  if (!p) return;
  if (tab === 'records') { const fn = getRecordRenderer(p); fn(); }
  else if (tab === 'tasks') renderProjectTasks();
  else if (tab === 'notes') renderProjectNotes();
  else if (tab === 'recipes') renderRecipes();
  else if (tab === 'timer') renderTimer();
  else if (tab === 'stats') renderProjectStats();
  else if (tab.startsWith('custom_')) renderCustomTab(tab, p);
}

/* ===== 自定义标签页 ===== */
function renderCustomTab(tabKey, project) {
  const panel = $('#panel-' + tabKey);
  if (!panel) return;
  const label = tabKey.replace('custom_', '');
  // 从 localStorage 读取内容
  const storageKey = `wb_custom_${currentPid}_${tabKey}`;

function openEditProjectModal(p) {
  let color = p.color || COLORS[0];
  const builtInTabs = [
    { key: 'records', label: '记录' },
    { key: 'tasks', label: '任务' },
    { key: 'notes', label: '笔记' },
    { key: 'recipes', label: '菜品' },
    { key: 'timer', label: '计时器' },
    { key: 'stats', label: '统计' }
  ];
  const currentTabs = getProjectTabs(p);
  // 提取自定义标签
  const customTabs = currentTabs.filter(t => t.startsWith('custom_')).map(t => ({ key: t, label: t.replace('custom_', '') }));
  const allTabs = [...builtInTabs, ...customTabs];

  const renderTabChecks = () => allTabs.map(t => {
    const curLabel = (p.tabLabels && p.tabLabels[t.key]) || t.label;
    return `
    <label style="display:flex;align-items:center;gap:6px;padding:6px 8px;border-radius:8px;background:var(--surface-2);width:100%;position:relative;">
      <input type="checkbox" class="tab-check" value="${t.key}" ${currentTabs.includes(t.key) ? 'checked' : ''} />
      <input type="text" class="tab-label-edit" data-key="${t.key}" value="${escapeHTML(curLabel)}" maxlength="10" style="flex:1;border:none;outline:none;background:transparent;font-size:13px;color:var(--ink);border:1px dashed transparent;padding:4px 6px;border-radius:6px;" onfocus="this.style.borderColor='var(--border)'" onblur="this.style.borderColor='transparent'" />
      ${t.key.startsWith('custom_') ? `<button type="button" class="custom-tab-remove" data-key="${t.key}" style="width:20px;height:20px;border-radius:50%;background:var(--border);color:var(--muted);display:grid;place-items:center;font-size:12px;border:none;cursor:pointer;flex-shrink:0;">×</button>` : ''}
    </label>
  `;
  }).join('');

  openModal(`
    <div class="modal-title">编辑项目</div>
    <div class="field"><label class="field-label">项目名称</label><input class="field-input" id="ePName" value="${escapeHTML(p.name)}" maxlength="20" /></div>
    <div class="field"><label class="field-label">模块名称（可自定义）</label><input class="field-input" id="ePModule" value="${escapeHTML(p.module)}" placeholder="如：学习 / 旅行 / 自定义" maxlength="10" /></div>
    <div class="field"><label class="field-label">描述（可选）</label><input class="field-input" id="ePDesc" value="${escapeHTML(p.desc || '')}" placeholder="项目简介" maxlength="40" /></div>
    <div class="field"><label class="field-label">主题色</label><div class="color-pick" id="ePColor">
      ${COLORS.map((c,i) => `<button class="color-opt ${c===color?'sel':''}" data-c="${c}" style="background:${c}"></button>`).join('')}
    </div></div>
    <div class="field">
      <label class="field-label">功能标签（至少选一项，名称可直接点击修改）</label>
      <div style="display:flex;flex-direction:column;gap:8px;" id="editTabChecks">${renderTabChecks()}</div>
    </div>
    <div class="field">
      <label class="field-label">添加自定义标签</label>
      <div style="display:flex;gap:8px;">
        <input class="field-input" id="eNewTabName" placeholder="输入标签名（如：灵感）" maxlength="10" style="flex:1;" />
        <button class="btn btn-ghost" id="addCustomTabBtn" style="padding:0 12px;">添加</button>
      </div>
      <div style="font-size:11px;color:var(--muted);margin-top:4px;">自定义标签作为空白页面，可自由填写内容；内置标签名可直接点击修改，不影响功能</div>
    </div>
    <div class="field"><label class="field-label">默认打开标签</label>
      <select class="field-input" id="ePDefaultTab">
        ${allTabs.filter(t => currentTabs.includes(t.key)).map(t => `<option value="${t.key}" ${(p.defaultTab||'')===t.key?'selected':''}>${t.label}</option>`).join('')}
      </select>
    </div>
    <div class="modal-actions"><button class="btn btn-ghost" onclick="closeModal()">取消</button><button class="btn btn-primary" id="ePSave">保存</button></div>
  `);

  const addCustomTab = (name) => {
    const key = 'custom_' + name;
    if (allTabs.some(t => t.key === key)) { toast('标签已存在'); return; }
    allTabs.push({ key, label: name });
    currentTabs.push(key);
    $('#editTabChecks').innerHTML = renderTabChecks();
    updateDefaultOptions();
    bindCustomTabRemove();
  };

  const bindCustomTabRemove = () => {
    $$('.custom-tab-remove').forEach(btn => {
      btn.onclick = (e) => {
        e.preventDefault();
        e.stopPropagation();
        const key = btn.dataset.key;
        const idx = allTabs.findIndex(t => t.key === key);
        if (idx > -1) allTabs.splice(idx, 1);
        const cidx = currentTabs.indexOf(key);
        if (cidx > -1) currentTabs.splice(cidx, 1);
        $('#editTabChecks').innerHTML = renderTabChecks();
        updateDefaultOptions();
        bindCustomTabRemove();
      };
    });
  };

  $('#ePColor').querySelectorAll('.color-opt').forEach(b => b.addEventListener('click', () => {
    $('#ePColor').querySelectorAll('.color-opt').forEach(x => x.classList.remove('sel'));
    b.classList.add('sel'); color = b.dataset.c;
  }));

  $('#addCustomTabBtn').onclick = () => {
    const name = $('#eNewTabName').value.trim();
    if (!name) { toast('请输入标签名'); return; }
    addCustomTab(name);
    $('#eNewTabName').value = '';
  };

  // 动态更新默认标签下拉选项（显示为用户可能已改的名）
  const updateDefaultOptions = () => {
    const checked = Array.from($$('.tab-check')).filter(cb => cb.checked).map(cb => cb.value);
    const select = $('#ePDefaultTab');
    const currentVal = select.value;
    // 构建显示名：取 input 中的值
    const getDisplayLabel = (key) => {
      const input = document.querySelector(`.tab-label-edit[data-key="${key}"]`);
      if (input) return input.value.trim() || (allTabs.find(t => t.key === key)?.label || key);
      return allTabs.find(t => t.key === key)?.label || key;
    };
    select.innerHTML = allTabs.filter(t => checked.includes(t.key)).map(t => `<option value="${t.key}">${escapeHTML(getDisplayLabel(t.key))}</option>`).join('');
    if (checked.includes(currentVal)) select.value = currentVal;
    else if (checked.length) select.value = checked[0];
  };
  $$('.tab-check').forEach(cb => cb.addEventListener('change', updateDefaultOptions));
  // 当用户改标签名时同步刷新 defaultTab 下拉显示（绑定到弹窗容器，避免泄漏）
  const modal = $('#modal');
  const onTabLabelInput = (e) => {
    if (e.target.classList?.contains('tab-label-edit')) updateDefaultOptions();
  };
  modal.addEventListener('input', onTabLabelInput);
  bindCustomTabRemove();

  $('#ePSave').addEventListener('click', () => {
    const name = $('#ePName').value.trim();
    const module = $('#ePModule').value.trim();
    const desc = $('#ePDesc').value.trim();
    const tabs = Array.from($$('.tab-check')).filter(cb => cb.checked).map(cb => cb.value);
    const defaultTab = $('#ePDefaultTab').value;
    // 收集用户自定义的标签显示名
    const tabLabels = {};
    $$('.tab-label-edit').forEach(input => {
      const key = input.dataset.key;
      const val = input.value.trim();
      const defaultName = (TAB_INFO[key]?.label) || (key.startsWith('custom_') ? key.replace('custom_','') : key);
      if (val && val !== defaultName) tabLabels[key] = val;
    });
    if (!name) { toast('请输入项目名称'); return; }
    if (!tabs.length) { toast('至少选择一个功能标签'); return; }
    p.name = name; p.module = module; p.desc = desc; p.color = color; p.tabs = tabs; p.defaultTab = defaultTab; p.tabLabels = tabLabels;
    DB.save(); closeModal(); renderAll(); toast('项目已更新');
  });
}

function deleteProject(p) {

    <div class="modal-title">删除项目</div>

  `);

    const videoIds = DB.notes.filter(n => n.pid === p.id && n.videoId).map(n => n.videoId);
    const imgIds = DB.tasks.filter(t => t.pid === p.id && t.imgId).map(t => t.imgId);
    videoIds.forEach(vid => { try { VideoStore.delete(vid).catch(()=>{}); } catch(e){} });
    imgIds.forEach(iid => { try { VideoStore.deleteImg(iid).catch(()=>{}); } catch(e){} });
    // 清理该项目所有自定义标签的 localStorage（wb_custom_{pid}_{tabKey}）
    try {
      Object.keys(localStorage).filter(k => k.startsWith(`wb_custom_${p.id}_`)).forEach(k => localStorage.removeItem(k));
    } catch(e) {}
    DB.projects = DB.projects.filter(x => x.id !== p.id);
    DB.tasks = DB.tasks.filter(t => t.pid !== p.id);
    DB.notes = DB.notes.filter(n => n.pid !== p.id);

    DB.save();
    closeModal();

    toast('项目已删除');
  });
}

/* ===== 每日记录（健康项目） ===== */
function todayStr() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function fmtDate(s) {
  const d = new Date(s);
  return `${d.getMonth()+1}月${d.getDate()}日`;
}
function isToday(s) { return s === todayStr(); }

/* ===== 专注计时器 ===== */
const TIMER_MODES = {
  focus: { name: '专注', duration: 25 * 60, color: 'var(--accent)' },
  short: { name: '短休', duration: 5 * 60, color: 'var(--success)' },
  long: { name: '长休', duration: 15 * 60, color: 'var(--purple)' }
};
let timerState = {
  mode: 'focus',
  remaining: TIMER_MODES.focus.duration,
  running: false,
  intervalId: null,
  completedCount: 0,
  totalSeconds: 0
};

// 从 localStorage 恢复今日数据
function loadTimerStats() {
  const today = todayStr();
  const saved = JSON.parse(localStorage.getItem('wb_timer_stats') || '{}');
  if (saved.date === today) {
    timerState.completedCount = saved.completedCount || 0;
    timerState.totalSeconds = saved.totalSeconds || 0;
  } else {
    timerState.completedCount = 0;
    timerState.totalSeconds = 0;
  }
}

function saveTimerStats() {
  localStorage.setItem('wb_timer_stats', JSON.stringify({
    date: todayStr(),
    completedCount: timerState.completedCount,
    totalSeconds: timerState.totalSeconds
  }));
}

function fmtTimerTime(sec) {
  const m = Math.floor(sec / 60);
  const s = sec % 60;
  return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
}

function renderTimer() {
  loadTimerStats();
  const wrap = $('#panel-timer');
  if (!wrap) return;
  const mode = TIMER_MODES[timerState.mode];
  const progress = 1 - timerState.remaining / mode.duration;
  const circumference = 2 * Math.PI * 90;
  const offset = circumference * (1 - progress);

  wrap.innerHTML = `
    <div class="timer-wrap">
      <div class="timer-head">
        <div class="timer-title">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2 2M9 2h6"/></svg>
          专注计时器
          <span style="font-size:12px;color:var(--muted);font-weight:400;margin-left:6px;">· 当前项目：${escapeHTML(DB.projects.find(x=>x.id===currentPid)?.name || '—')}</span>
        </div>
        <div class="timer-mode">
          ${Object.entries(TIMER_MODES).map(([k, m]) =>
            `<button class="timer-mode-btn ${timerState.mode===k?'active':''}" data-mode="${k}">${m.name}</button>`
          ).join('')}
        </div>
      </div>
      <div class="timer-display">
        <svg class="timer-ring" viewBox="0 0 200 200">
          <circle class="timer-ring-track" cx="100" cy="100" r="90"/>
          <circle class="timer-ring-prog" cx="100" cy="100" r="90"
            stroke="${mode.color}"
            stroke-dasharray="${circumference}"
            stroke-dashoffset="${offset}"/>
        </svg>
        <div class="timer-text">
          <div class="timer-time">${fmtTimerTime(timerState.remaining)}</div>
          <div class="timer-label ${timerState.running?'running':''}">${timerState.running ? '进行中' : '已暂停'}</div>
        </div>
      </div>
      <div class="timer-controls">
        <button class="timer-btn timer-btn-primary" id="timerToggle">
          ${timerState.running
            ? `<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>暂停`
            : `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>开始`}
        </button>
        <button class="timer-btn timer-btn-ghost" id="timerReset">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>
          重置
        </button>
      </div>
      <div class="timer-custom">
        自定义时长：
        <input type="number" id="customMin" min="1" max="120" value="${Math.floor(mode.duration/60)}" /> 分钟
        <button class="btn btn-ghost" id="applyCustom" style="padding:4px 10px;font-size:12px;">应用</button>
      </div>
      <div class="timer-stats">
        <div class="timer-stat">
          <div class="timer-stat-num">${timerState.completedCount}</div>
          <div class="timer-stat-lbl">今日完成</div>
        </div>
        <div class="timer-stat">
          <div class="timer-stat-num">${Math.floor(timerState.totalSeconds/60)}</div>
          <div class="timer-stat-lbl">专注分钟</div>
        </div>
        <div class="timer-stat">
          <div class="timer-stat-num">${Math.floor(timerState.totalSeconds/3600)}</div>
          <div class="timer-stat-lbl">专注小时</div>
        </div>
      </div>
    </div>
    <div style="font-size:13px;color:var(--muted);text-align:center;padding:0 20px;line-height:1.6;">
      💡 建议：专注 25 分钟 → 休息 5 分钟 → 每完成 4 个专注周期后长休 15 分钟
    </div>
  `;

  // 模式切换
  wrap.querySelectorAll('.timer-mode-btn').forEach(b => {
    b.onclick = () => {
      if (timerState.running) {
        toast('请先暂停当前计时');
        return;
      }
      timerState.mode = b.dataset.mode;
      timerState.remaining = TIMER_MODES[timerState.mode].duration;
      renderTimer();
    };
  });

  // 开始/暂停
  $('#timerToggle').onclick = () => {
    if (timerState.running) {
      pauseTimer();
    } else {
      startTimer();
    }
  };

  // 重置
  $('#timerReset').onclick = () => {
    if (timerState.intervalId) clearInterval(timerState.intervalId);
    timerState.running = false;
    timerState.remaining = TIMER_MODES[timerState.mode].duration;
    renderTimer();
  };

  // 自定义时长
  $('#applyCustom').onclick = () => {
    if (timerState.running) { toast('请先暂停'); return; }
    const min = parseInt($('#customMin').value);
    if (min > 0 && min <= 120) {
      timerState.remaining = min * 60;
      // 更新当前模式时长（不持久化，仅本次）
      TIMER_MODES[timerState.mode].duration = min * 60;
      renderTimer();
      toast(`已设置为 ${min} 分钟`);
    }
  };
}

function startTimer() {
  timerState.running = true;
  timerState.intervalId = setInterval(() => {
    timerState.remaining--;
    if (timerState.remaining <= 0) {
      // 完成
      clearInterval(timerState.intervalId);
      timerState.running = false;
      timerState.completedCount++;
      timerState.totalSeconds += TIMER_MODES[timerState.mode].duration;
      saveTimerStats();

      const modeName = TIMER_MODES[timerState.mode].name;
      if (timerState.mode === 'focus') {
        celebrate('🎯', `${modeName}完成！`);
        if (navigator.vibrate) navigator.vibrate([100, 50, 100]);
        // 自动切到短休
        timerState.mode = timerState.completedCount % 4 === 0 ? 'long' : 'short';
      } else {
        celebrate('☕', '休息结束，继续加油！');
        if (navigator.vibrate) navigator.vibrate(100);
        timerState.mode = 'focus';
      }
      timerState.remaining = TIMER_MODES[timerState.mode].duration;
      renderTimer();
      toast(`${modeName}时间到！`);
    } else {
      // 仅更新显示，避免重新渲染
      const timeEl = document.querySelector('.timer-time');
      const labelEl = document.querySelector('.timer-label');
      const progEl = document.querySelector('.timer-ring-prog');
      if (timeEl) timeEl.textContent = fmtTimerTime(timerState.remaining);
      if (labelEl) { labelEl.textContent = '进行中'; labelEl.classList.add('running'); }
      if (progEl) {
        const mode = TIMER_MODES[timerState.mode];
        const progress = 1 - timerState.remaining / mode.duration;
        const circumference = 2 * Math.PI * 90;
        progEl.setAttribute('stroke-dashoffset', circumference * (1 - progress));
      }
    }
  }, 1000);
  renderTimer();
}

function pauseTimer() {
  clearInterval(timerState.intervalId);
  timerState.running = false;
  renderTimer();
}

/* ===== 菜谱（生活项目） ===== */

/* ===== 本地视频存储（IndexedDB） ===== */
const VideoStore = {
  db: null,
  async init() {
    if (this.db) return this.db;
    return new Promise((resolve, reject) => {
      const req = indexedDB.open('wb_videos', 2);
      req.onupgradeneeded = (e) => {
        const db = e.target.result;
        if (!db.objectStoreNames.contains('videos')) {
          db.createObjectStore('videos', { keyPath: 'id' });
        }
        if (!db.objectStoreNames.contains('images')) {
          db.createObjectStore('images', { keyPath: 'id' });
        }
      };
      req.onsuccess = (e) => { this.db = e.target.result; resolve(this.db); };
      req.onerror = () => reject(req.error);
    });
  },
  async save(id, blob, name) {
    await this.init();
    return new Promise((resolve, reject) => {
      const tx = this.db.transaction('videos', 'readwrite');
      tx.objectStore('videos').put({ id, blob, name, size: blob.size, ts: Date.now() });
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error);
    });
  },
  async get(id) {
    await this.init();
    return new Promise((resolve, reject) => {
      const tx = this.db.transaction('videos', 'readonly');
      const req = tx.objectStore('videos').get(id);
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  },
  async delete(id) {
    await this.init();
    return new Promise((resolve, reject) => {
      const tx = this.db.transaction('videos', 'readwrite');
      tx.objectStore('videos').delete(id);
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error);
    });
  },
  // ===== 图片存储（任务附件） =====
  async saveImg(id, blob) {
    await this.init();
    return new Promise((resolve, reject) => {
      const tx = this.db.transaction('images', 'readwrite');
      tx.objectStore('images').put({ id, blob, size: blob.size, ts: Date.now() });
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error);
    });
  },
  async getImg(id) {
    await this.init();
    return new Promise((resolve, reject) => {
      const tx = this.db.transaction('images', 'readonly');
      const req = tx.objectStore('images').get(id);
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  },
  async deleteImg(id) {
    await this.init();
    return new Promise((resolve, reject) => {
      const tx = this.db.transaction('images', 'readwrite');
      tx.objectStore('images').delete(id);
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error);
    });
  }
};

function fmtFileSize(bytes) {
  if (bytes < 1024) return bytes + 'B';
  if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + 'KB';
  return (bytes / (1024 * 1024)).toFixed(1) + 'MB';
}

/* ===== 菜谱（生活项目） ===== */
function getRecipeVideoEmbed(url) {
  if (!url) return null;
  // B站
  const bili = url.match(/bilibili\.com\/video\/(BV[\w]+)/);
  if (bili) {
    return `https://player.bilibili.com/player.html?bvid=${bili[1]}&high_quality=1&autoplay=0`;
  }
  // YouTube
  const yt = url.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/)([\w-]+)/);
  if (yt) {
    return `https://www.youtube.com/embed/${yt[1]}`;
  }
  // 抖音 - 无法直接嵌入，返回原链接
  if (url.includes('douyin.com')) {
    return { link: url, text: '抖音视频链接' };
  }
  // 西瓜视频
  const xg = url.match(/ixigua\.com\/(\d+)/);
  if (xg) {
    return `https://www.ixigua.com/iframe/${xg[1]}`;
  }
  // 通用：如果是 mp4 链接，直接用 video 标签
  if (url.match(/\.(mp4|webm|ogg)$/i)) {
    return { video: url };
  }
  return { link: url, text: '查看视频' };
}

function getRecipeThumb(title) {
  // 根据菜品名称返回 emoji
  const map = {
    '蛋': '🥚', '鸡': '🍗', '鱼': '🐟', '肉': '🥩', '虾': '🦐', '蟹': '🦀',
    '汤': '🍲', '面': '🍜', '饭': '🍚', '粥': '🥣', '饼': '🥞', '糕': '🍰',
    '菜': '🥬', '菇': '🍄', '豆': '🫘', '腐': '🧈', '茶': '🍵', '果': '🍎',
    '沙拉': '🥗', '寿司': '🍣', '披萨': '🍕', '汉堡': '🍔', '三明治': '🥪'
  };
  for (const [k, v] of Object.entries(map)) {
    if (title.includes(k)) return v;
  }
  return '🍽️';
}

  }

  wrap.innerHTML = `

      <button class="btn btn-primary" id="addRecipeBtn" style="padding:6px 14px;font-size:13px;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        添加

        <div class="recipe-card" data-id="${r.id}">

          <div class="recipe-body">
            <div class="recipe-name">${escapeHTML(r.title)}</div>
            ${r.tag ? `<span class="recipe-tag">${escapeHTML(r.tag)}</span>` : ''}
          </div>
        </div>
      `).join('')}
    </div>
  `;

  // 搜索功能
  const searchInput = $('#recipeSearchInput');
  const renderRecipeList = (list) => {
    const grid = $('#recipeGrid');
    const count = $('#recipeCount');
    count.textContent = list.length;
    if (list.length === 0) {
      grid.innerHTML = `<div style="text-align:center;padding:32px;color:var(--muted);">没有匹配的菜品</div>`;
      return;
    }
    grid.innerHTML = list.map(r => `
      <div class="recipe-card" data-id="${r.id}">
        <div class="recipe-thumb ${(r.videoUrl || r.videoType==='local')?'has-video':''}">${getRecipeThumb(r.title)}</div>
        <div class="recipe-body">
          <div class="recipe-name">${escapeHTML(r.title)}</div>
          ${r.tag ? `<span class="recipe-tag">${escapeHTML(r.tag)}</span>` : ''}
        </div>
      </div>
    `).join('');
    grid.querySelectorAll('.recipe-card').forEach(card => {
      card.onclick = () => openRecipeDetail(+card.dataset.id);
    });
  };

  searchInput.addEventListener('input', (e) => {
    const query = e.target.value.trim().toLowerCase();
    if (!query) {
      renderRecipeList(recipes);
      return;
    }
    const filtered = recipes.filter(r => {
      const title = (r.title || '').toLowerCase();
      const content = (r.content || '').toLowerCase();
      const tag = (r.tag || '').toLowerCase();
      return title.includes(query) || content.includes(query) || tag.includes(query);
    });
    renderRecipeList(filtered);
  });

  $('#addRecipeBtn').onclick = () => openRecipeEditor();
  wrap.querySelectorAll('.recipe-card').forEach(card => {
    card.onclick = () => openRecipeDetail(+card.dataset.id);

function openRecipeEditor(id) {
  const r = id ? DB.notes.find(n => n.id === id) : null;
  const hasLocalVideo = r && r.videoType === 'local';
  const hasLinkVideo = r && r.videoUrl && !hasLocalVideo;

  openModal(`
    <div class="modal-title">${r ? '编辑菜品' : '添加菜品'}</div>
    <div class="field"><label class="field-label">菜名</label><input class="field-input" id="rName" placeholder="如：番茄炒蛋" value="${r ? escapeHTML(r.title) : ''}" /></div>
    <div class="field"><label class="field-label">分类标签</label><input class="field-input" id="rTag" placeholder="如：家常菜 / 汤 / 早餐" value="${r ? escapeHTML(r.tag || '') : ''}" /></div>
    <div class="field"><label class="field-label">食材与做法</label><textarea class="field-input" id="rContent" rows="6" placeholder="食材：&#10;做法：&#10;1. ...&#10;2. ...">${r ? escapeHTML(r.content || '') : ''}</textarea></div>
    <div class="field">
      <label class="field-label">视频教程（可选）</label>
      <div class="video-source-tabs">
        <button class="video-source-tab ${hasLocalVideo?'':'active'}" data-src="link">🔗 视频链接</button>
        <button class="video-source-tab ${hasLocalVideo?'active':''}" data-src="local">📁 本地视频</button>
      </div>
      <div id="videoLinkBox" style="${hasLocalVideo?'display:none;':''}">
        <input class="field-input" id="rVideo" placeholder="支持 B站 / YouTube / 抖音 / mp4 链接" value="${r && !hasLocalVideo ? escapeHTML(r.videoUrl || '') : ''}" />
        <div style="font-size:11px;color:var(--muted);margin-top:4px;">💡 B站和 YouTube 会自动嵌入播放器，抖音将显示为外链</div>
      </div>
      <div id="videoLocalBox" style="${hasLocalVideo?'':'display:none;'}">
        <div class="video-upload-zone" id="videoUploadZone">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/></svg>
          <div class="upload-text">点击选择视频文件</div>
          <div class="upload-hint">支持 mp4 / webm / mov，单个文件最大 500MB</div>
          <div class="upload-hint" id="storageHint" style="margin-top:6px;color:var(--muted);">正在查询可用存储空间...</div>
        </div>
        <input type="file" id="rVideoFile" accept="video/*" style="display:none;" />
        <div id="videoFileInfo" style="${hasLocalVideo?'':'display:none;'}">
          <div class="video-file-info">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2"/></svg>
            <span class="file-name">${hasLocalVideo ? escapeHTML(r.videoName || '已上传视频') : ''}</span>
            <span class="file-size" id="videoFileSize">${hasLocalVideo && r.videoSize ? fmtFileSize(r.videoSize) : ''}</span>
            <span class="file-remove" id="videoRemoveBtn">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
            </span>
          </div>
        </div>
      </div>
    </div>
    <div class="modal-actions">
      ${r ? `<button class="btn btn-ghost" style="margin-right:auto;color:var(--danger);" id="rDel">删除</button>` : ''}
      <button class="btn btn-ghost" onclick="closeModal()">取消</button>
      <button class="btn btn-primary" id="rSave">保存</button>
    </div>
  `);

  // 视频来源切换
  let currentVideoSource = hasLocalVideo ? 'local' : 'link';
  let pendingVideoFile = null; // 待保存的本地视频文件

  $$('.video-source-tab').forEach(tab => {
    tab.onclick = () => {
      currentVideoSource = tab.dataset.src;
      $$('.video-source-tab').forEach(t => t.classList.toggle('active', t === tab));
      $('#videoLinkBox').style.display = currentVideoSource === 'link' ? '' : 'none';
      $('#videoLocalBox').style.display = currentVideoSource === 'local' ? '' : 'none';
    };
  });

  // 本地视频上传
  $('#videoUploadZone').onclick = () => $('#rVideoFile').click();

  // 查询并显示可用存储空间
  const updateStorageHint = () => {
    const hint = $('#storageHint');
    if (!hint) return;
    if (navigator.storage && navigator.storage.estimate) {
      navigator.storage.estimate().then(est => {
        const total = est.quota || 0;
        const used = est.usage || 0;
        const remaining = total - used;
        hint.innerHTML = `💾 总配额 <b>${fmtFileSize(total)}</b> · 已用 <b>${fmtFileSize(used)}</b> · 剩余 <b style="color:var(--success);">${fmtFileSize(remaining)}</b>`;
      }).catch(() => { hint.textContent = '💾 无法查询存储配额'; });
    } else {
      hint.textContent = '💾 当前浏览器不支持存储配额查询';
    }
  };
  updateStorageHint();

  $('#rVideoFile').onchange = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    if (file.size > 500 * 1024 * 1024) {
      toast('视频不能超过 500MB');
      return;
    }
    // 检查存储配额是否足够
    if (navigator.storage && navigator.storage.estimate) {
      navigator.storage.estimate().then(est => {
        const remaining = (est.quota || 0) - (est.usage || 0);
        if (file.size > remaining) {
          toast('存储空间不足，请清理浏览器缓存或删除旧视频');
          return;
        }
        pendingVideoFile = file;
        $('#videoUploadZone').classList.add('has-file');
        $('#videoUploadZone').querySelector('.upload-text').textContent = '已选择，可重新点击更换';
        $('#videoFileInfo').style.display = '';
        $('#videoFileInfo .file-name').textContent = file.name;
        $('#videoFileSize').textContent = fmtFileSize(file.size);
      });
      return;
    }
    pendingVideoFile = file;
    $('#videoUploadZone').classList.add('has-file');
    $('#videoUploadZone').querySelector('.upload-text').textContent = '已选择，可重新点击更换';
    $('#videoFileInfo').style.display = '';
    $('#videoFileInfo .file-name').textContent = file.name;
    $('#videoFileSize').textContent = fmtFileSize(file.size);
  };

  // 移除已选视频
  $('#videoRemoveBtn').onclick = (e) => {
    e.stopPropagation();
    pendingVideoFile = null;
    $('#rVideoFile').value = '';
    $('#videoUploadZone').classList.remove('has-file');
    $('#videoUploadZone').querySelector('.upload-text').textContent = '点击选择视频文件';
    $('#videoFileInfo').style.display = 'none';
  };

  $('#rSave').onclick = async () => {
    const name = $('#rName').value.trim();
    if (!name) { toast('请输入菜名'); return; }

    const data = {
      title: name,
      tag: $('#rTag').value.trim(),
      content: $('#rContent').value.trim()
    };

    // 处理视频
    if (currentVideoSource === 'local') {
      if (pendingVideoFile) {
        // 新上传的本地视频
        const videoId = 'video_' + Date.now();
        try {
          await VideoStore.save(videoId, pendingVideoFile, pendingVideoFile.name);
          data.videoType = 'local';
          data.videoId = videoId;
          data.videoName = pendingVideoFile.name;
          data.videoSize = pendingVideoFile.size;
          data.videoUrl = ''; // 清空链接
        } catch (err) {
          toast('视频保存失败：' + err.message);
          return;
        }
      } else if (r && r.videoType === 'local') {
        // 保留原有本地视频
        data.videoType = 'local';
        data.videoId = r.videoId;
        data.videoName = r.videoName;
        data.videoSize = r.videoSize;
        data.videoUrl = '';
      }
    } else {
      // 链接模式
      const linkUrl = $('#rVideo').value.trim();
      data.videoUrl = linkUrl;
      data.videoType = 'link';
      // 如果原来是本地视频，现在改成链接，删除本地视频文件
      if (r && r.videoType === 'local' && r.videoId) {
        VideoStore.delete(r.videoId).catch(() => {});
      }
    }

    if (r) {
      Object.assign(r, data);
    } else {
      DB.notes.push({
        id: uid(),
        pid: currentPid,
        ...data,
        ts: Date.now()
      });
    }
    DB.save();
    closeModal();
    renderRecipes();
    renderProject();
    toast(r ? '已更新' : '已添加');
  };

  if (r) {
    $('#rDel').onclick = async () => {
      // 删除本地视频文件
      if (r.videoType === 'local' && r.videoId) {
        await VideoStore.delete(r.videoId).catch(() => {});
      }
      DB.notes = DB.notes.filter(n => n.id !== id);
      DB.save();
      closeModal();
      renderRecipes();
      renderProject();
      toast('已删除');
    };
  }
}

function openRecipeDetail(id) {
  const r = DB.notes.find(n => n.id === id);
  if (!r) return;

  // 判断视频类型
  const hasVideo = (r.videoUrl && r.videoType !== 'local') || r.videoType === 'local';
  let videoEmbed = null;
  if (r.videoType === 'local') {
    videoEmbed = { local: true, videoId: r.videoId, name: r.videoName };
  } else if (r.videoUrl) {
    videoEmbed = getRecipeVideoEmbed(r.videoUrl);
  }

  let videoHTML = '';
  if (videoEmbed) {
    if (videoEmbed.local) {
      // 本地视频 - 从 IndexedDB 异步加载
      videoHTML = `

              <div>加载本地视频中...</div>

      `;
    } else if (typeof videoEmbed === 'string') {
      // iframe 嵌入
      videoHTML = `

          <div class="recipe-section-title">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2"/></svg>

            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2"/></svg>
            视频教程

            <video src="${videoEmbed.video}" controls style="width:100%;border-radius:var(--radius);"></video>

        </div>
      `;
    } else if (videoEmbed.link) {
      // 外部链接
      videoHTML = `
        <div class="recipe-section">
          <div class="recipe-section-title">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2"/></svg>
            视频链接
          </div>
          <a href="${videoEmbed.link}" target="_blank" rel="noopener" class="recipe-video-link">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
            ${escapeHTML(videoEmbed.text || videoEmbed.link)}
          </a>
        </div>
      `;
    }
  }

  openModal(`
    <div class="recipe-detail">
      <div class="recipe-detail-head">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;">
          <div>
            <div class="recipe-detail-name">${escapeHTML(r.title)}</div>
            ${r.tag ? `<span class="recipe-detail-tag">${escapeHTML(r.tag)}</span>` : ''}
          </div>
          <button class="btn btn-ghost" id="rEdit" style="padding:6px 10px;font-size:12px;">编辑</button>
        </div>
      </div>

      ${r.content ? `
        <div class="recipe-section">
          <div class="recipe-section-title">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
            食材与做法
          </div>
          <div class="recipe-content">${escapeHTML(r.content)}</div>
        </div>
      ` : ''}

      ${videoHTML}
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal()">关闭</button>
    </div>
  `);

  // 异步加载本地视频
  if (videoEmbed && videoEmbed.local) {
    const container = $('#localVideoContainer');
    VideoStore.get(videoEmbed.videoId).then((record) => {
      if (!record) {
        container.innerHTML = '<div style="text-align:center;color:var(--danger);font-size:13px;">⚠️ 视频文件未找到，可能已被清理</div>';
        return;
      }
      const url = URL.createObjectURL(record.blob);
      container.innerHTML = `<video src="${url}" controls autoplay style="width:100%;border-radius:var(--radius);" data-obj-url="${url}"></video>`;
    }).catch((err) => {
      container.innerHTML = `<div style="text-align:center;color:var(--danger);font-size:13px;">⚠️ 加载失败：${err.message}</div>`;
    });
  }

  $('#rEdit').onclick = () => {
    closeModal();
    setTimeout(() => openRecipeEditor(id), 200);
  };
}

const EX_CAL = {

};

/* 日常活动消耗（MET值 × 体重kg × 小时） */
const DAILY_ACTIVITIES = {
  '步行(慢速)': 3.0, '步行(快速)': 4.5, '走路通勤': 3.5, '上楼梯': 6.0, '下楼梯': 3.0,

};

function estimateDailyBurn(activities, weight) {
  let total = 0;
  const w = weight || 60; // 默认60kg
  activities.forEach(a => {
    if (a.name === '__custom__' && a.kcal) { total += parseInt(a.kcal) || 0; return; }
    const met = DAILY_ACTIVITIES[a.name] || 2.0;
    const hours = (parseInt(a.minutes) || 0) / 60;
    total += Math.round(met * w * hours);
  });
  return total;
}

function estimateIntake(diet) {
  let total = 0, matched = [];
  const meals = [
    { label: '早餐', text: diet.breakfast, manual: diet.breakfastCal },
    { label: '午餐', text: diet.lunch, manual: diet.lunchCal },
    { label: '晚餐', text: diet.dinner, manual: diet.dinnerCal },
    { label: '加餐', text: diet.snack, manual: diet.snackCal }
  ];
  const mealCal = [];
  for (const meal of meals) {
    if (!meal.text && !meal.manual) continue;
    // 优先使用手动填写的卡路里
    if (meal.manual && parseInt(meal.manual) > 0) {
      const cal = parseInt(meal.manual);
      mealCal.push({ label: meal.label, cal, items: ['手动填写'], manual: true });
      total += cal;
      continue;
    }
    // 否则自动估算
    let mTotal = 0, mMatched = [];
    if (meal.text) {
      for (const k in FOOD_CAL) {
        if (meal.text.includes(k)) { mTotal += FOOD_CAL[k]; mMatched.push(k); }
      }
    }
    if (mTotal > 0 || mMatched.length > 0) {
      mealCal.push({ label: meal.label, cal: mTotal, items: mMatched });
      total += mTotal;
      matched.push(...mMatched);
    }
  }
  return { total, matched, mealCal };
}
function estimateBurn(training) {
  let total = 0;
  training.forEach(t => {
    for (const k in EX_CAL) {
      if (t.name.includes(k)) {
        const sets = parseInt(t.sets) || 3;
        total += EX_CAL[k] * sets;
        break;
      }
    }
  });
  return total;
}
function generateAdvice(diet, training, intake, burn) {
  const advice = [];
  const target = localStorage.getItem('wb_fitness_goal') || 'maintain';
  const goalNames = { bulk: '增肌', cut: '减脂', shape: '塑形', maintain: '维持' };
  const profile = JSON.parse(localStorage.getItem('wb_profile') || '{}');
  // 基于个人信息的BMR计算（Mifflin-St Jeor公式）
  let targetCal;
  if (profile.weight && profile.height && profile.age) {
    const w = parseFloat(profile.weight);
    const h = parseFloat(profile.height);
    const a = parseFloat(profile.age);
    const bmr = profile.gender === 'female'
      ? 10*w + 6.25*h - 5*a - 161
      : 10*w + 6.25*h - 5*a + 5;
    const tdee = Math.round(bmr * 1.4); // 轻度活动系数
    targetCal = target === 'bulk' ? tdee + 300 : target === 'cut' ? tdee - 400 : tdee;
  } else {
    targetCal = { bulk: 2600, cut: 1600, shape: 2000, maintain: 2000 }[target];
  }
  const text = [diet.breakfast, diet.lunch, diet.dinner, diet.snack].join(' ');
  // 目标提示
  advice.push({ t: `当前目标：${goalNames[target]}（建议摄入 ${targetCal}kcal/天${profile.weight?' · 基于BMR计算':' · 默认值'}）`, lvl: 'info' });
  // 摄入评估（基于目标）
  if (intake > 0 && intake < targetCal - 400) advice.push({ t: `能量摄入偏低（约${intake}kcal），低于${goalNames[target]}目标${targetCal}kcal较多，建议增加碳水/蛋白摄入。`, lvl: 'warn' });
  else if (intake > targetCal + 500) advice.push({ t: `能量摄入偏高（约${intake}kcal），超出${goalNames[target]}目标较多，建议控制热量。`, lvl: 'warn' });
  else if (intake > 0) advice.push({ t: `能量摄入（约${intake}kcal）与${goalNames[target]}目标接近，保持住。`, lvl: 'good' });
  // 蛋白质
  const hasProtein = /鸡|鱼|虾|牛肉|鸡蛋|蛋白|牛奶|豆|三文鱼|金枪鱼/.test(text);
  if (intake > 0 && !hasProtein) advice.push({ t: '今日饮食未见明显蛋白来源，建议补充鸡胸/鸡蛋/鱼/豆制品。', lvl: 'warn' });
  if (target === 'bulk' && hasProtein) advice.push({ t: '增肌期蛋白摄入充足，建议每公斤体重1.6-2.2g蛋白质，分布在4-5餐。', lvl: 'good' });
  // 蔬菜
  const hasVeg = /菜|西兰花|菠菜|生菜|黄瓜|番茄|西红柿|胡萝卜|蔬菜/.test(text);
  if (intake > 0 && !hasVeg) advice.push({ t: '蔬菜偏少，建议每餐搭配一份蔬菜，补充膳食纤维。', lvl: 'info' });
  // 训练
  if (training.length === 0 && intake > 0) advice.push({ t: '今日未记录训练，建议安排适量运动，哪怕散步20分钟。', lvl: 'info' });
  else if (training.length >= 4) advice.push({ t: '训练动作较多（'+training.length+'项），注意组间休息和拉伸放松。', lvl: 'info' });
  // 目标专项建议
  if (target === 'cut' && burn > 0) {
    const net = intake - burn;
    if (net > 0 && net < 500) advice.push({ t: `减脂期净摄入${net}kcal，热量缺口合适，继续保持。`, lvl: 'good' });
    else if (net > 800) advice.push({ t: `减脂期净摄入${net}kcal偏高，建议增加有氧或减少碳水。`, lvl: 'warn' });
  }
  if (target === 'bulk' && burn > 0) {
    const net = intake - burn;
    if (net < 200) advice.push({ t: `增肌期净摄入仅${net}kcal，建议增加碳水摄入确保热量盈余。`, lvl: 'warn' });
  }
  if (target === 'shape' && training.length > 0) {
    advice.push({ t: '塑形期建议结合力量训练与有氧，关注蛋白质摄入和训练后拉伸。', lvl: 'good' });
  }
  // 净能量
  if (intake > 0 && burn > 0) {
    const net = intake - burn;
    advice.push({ t: '训练消耗约 '+burn+'kcal，净摄入约 '+net+'kcal。', lvl: 'info' });
  }
  return advice;
}
function evalHTML(diet, training, dailyActivities) {
  const intake = estimateIntake(diet);
  const profile = JSON.parse(localStorage.getItem('wb_profile') || '{}');
  const burn = estimateBurn(training);
  const dailyBurn = dailyActivities && dailyActivities.length > 0 ? estimateDailyBurn(dailyActivities, profile.weight) : 0;
  const totalBurn = burn + dailyBurn;
  const advice = generateAdvice(diet, training, intake.total, totalBurn);
  if (intake.total === 0 && burn === 0 && advice.length === 0) return '';
  const lvlColor = { good: 'var(--success)', warn: 'var(--danger)', info: 'var(--muted)' };
  const lvlIcon = { good: '✓', warn: '!', info: '·' };
  return `
    <div class="eval-box glass" style="background:rgba(123,79,168,0.06); border:1px solid rgba(123,79,168,0.15);">
      <div class="eval-head">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--purple)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11H5a2 2 0 0 0-2 2v7a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7a2 2 0 0 0-2-2h-4M9 11V7a3 3 0 0 1 6 0v4M9 11h6"/></svg>
        AI 能量评估
      </div>
      <div class="eval-stats">
        <div class="eval-stat"><div class="eval-stat-num" style="color:var(--success);">${intake.total}</div><div class="eval-stat-lbl">摄入 kcal</div></div>
        <div class="eval-stat"><div class="eval-stat-num" style="color:var(--accent);">${burn}</div><div class="eval-stat-lbl">训练消耗</div></div>
        ${dailyBurn > 0 ? `<div class="eval-stat"><div class="eval-stat-num" style="color:#6495ED;">${dailyBurn}</div><div class="eval-stat-lbl">日常消耗</div></div>` : ''}
        <div class="eval-stat"><div class="eval-stat-num" style="color:var(--purple);">${intake.total - totalBurn}</div><div class="eval-stat-lbl">净摄入</div></div>
      </div>
      ${intake.matched.length ? `<div class="eval-matched">识别食物：${intake.matched.slice(0,8).map(m=>`<span class="eval-tag">${escapeHTML(m)}</span>`).join('')}</div>` : ''}
      ${intake.mealCal && intake.mealCal.length ? `<div style="display:flex;gap:8px;flex-wrap:wrap;margin:8px 0;">${intake.mealCal.map(m => `<div style="background:var(--surface);border-radius:8px;padding:6px 10px;font-size:12px;"><b style="color:var(--ink);">${escapeHTML(m.label)}</b> <span style="color:var(--success);font-weight:600;">${m.cal}kcal</span>${m.items.length?`<span style="color:var(--muted);margin-left:4px;">${m.items.map(i=>escapeHTML(i)).join('、')}</span>`:''}</div>`).join('')}</div>` : ''}
      ${advice.length ? `<div class="eval-advice">${advice.map(a=>`<div class="eval-advice-item" style="color:${lvlColor[a.lvl]};"><span class="eval-advice-icon">${lvlIcon[a.lvl]}</span>${escapeHTML(a.t)}</div>`).join('')}</div>` : ''}
    </div>
  `;
}

          <div class="diet-field"><label class="diet-label">加餐</label><div style="display:flex;gap:6px;"><input class="diet-input" id="d-snack" value="${escapeHTML(diet.snack)}" placeholder="如：坚果、水果" style="flex:1;" /><input type="time" id="d-snackTime" value="${escapeHTML(diet.snackTime||'')}" style="width:80px;padding:8px;border:1px solid var(--border);border-radius:8px;font-size:12px;color:var(--muted);" title="加餐时间（选填）" /><input class="diet-cal" id="d-snackCal" value="${escapeHTML(diet.snackCal||'')}" placeholder="kcal" inputmode="numeric" style="width:60px;padding:8px;border:1px solid var(--border);border-radius:8px;font-size:12px;color:var(--muted);" title="手动填写能量（选填）" /></div></div>
        </div>
      </div>
    </div>

    <div class="record-section glass" style="background:rgba(200,100,61,0.06);">
      <div class="record-section-head" style="color:var(--accent);">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 6.5h11M6.5 17.5h11M3 9.5h3v5H3zM18 9.5h3v5h-3z"/></svg>
        训练内容
      </div>
      <div class="record-section-body">
        <div id="trainingRows"></div>
        <button class="add-row-btn" id="addTrainRow"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>添加动作</button>
      </div>
    </div>

    <div class="record-section glass" style="background:rgba(100,149,237,0.05);">
      <div class="record-section-head" style="color:#6495ED;">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 17H3v-6a4 4 0 0 1 4-4h11a3 3 0 0 1 3 3v7h-2"/><circle cx="7" cy="17" r="2"/><circle cx="17" cy="17" r="2"/></svg>
        日常活动消耗（选填）
      </div>
      <div class="record-section-body">
        <div style="font-size:12px;color:var(--muted);margin-bottom:8px;">步行、上课、做家务等日常活动，自动估算消耗</div>
        <div id="dailyActivityRows"></div>
        <button class="add-row-btn" id="addDailyRow" style="color:#6495ED;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>添加日常活动</button>
      </div>
    </div>

    <div class="record-section glass" style="background:rgba(128,120,116,0.05);">
      <div class="record-section-head">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>
        备注
      </div>
      <div class="record-section-body">
        <textarea class="record-note" id="d-note" placeholder="身体状态、感受等...">${escapeHTML(note)}</textarea>
      </div>
    </div>

    <div class="record-actions">
      <button class="btn btn-primary" id="saveRecord">保存记录</button>
    </div>
    <div id="evalPreview"></div>
  `;

  const rowsWrap = $('#trainingRows');

  // 健身目标切换
  form.querySelectorAll('.goal-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      localStorage.setItem('wb_fitness_goal', btn.dataset.goal);
      form.querySelectorAll('.goal-btn').forEach(b => {
        const active = b.dataset.goal === btn.dataset.goal;
        b.classList.toggle('goal-btn-active', active);
        b.style.background = active ? 'var(--purple)' : 'var(--surface)';
        b.style.color = active ? '#fff' : 'var(--ink-2)';
      });
      updateEval();
    });
  });

  const renderTrainRow = (tr) => {
    const div = document.createElement('div');
    div.className = 'training-row';
    div.innerHTML = `
      <input class="t-name" value="${escapeHTML(tr.name)}" placeholder="动作名称" />
      <input class="t-sets" value="${escapeHTML(String(tr.sets))}" placeholder="组" inputmode="numeric" />
      <input class="t-reps" value="${escapeHTML(String(tr.reps))}" placeholder="次" inputmode="numeric" />
      <input class="t-weight" value="${escapeHTML(String(tr.weight))}" placeholder="kg" inputmode="decimal" />
      <button class="row-del"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
    `;
    div.querySelector('.row-del').addEventListener('click', () => {
      if (rowsWrap.children.length > 1) div.remove();
      else { div.querySelectorAll('input').forEach(i => i.value = ''); }
    });
    rowsWrap.appendChild(div);
  };
  training.forEach(renderTrainRow);
  $('#addTrainRow').addEventListener('click', () => renderTrainRow({ name:'', sets:'', reps:'', weight:'' }));

  // 日常活动行
  const dailyWrap = $('#dailyActivityRows');
  const dailyActivities = existing?.dailyActivities || [];
  const renderDailyRow = (da) => {
    const div = document.createElement('div');
    div.className = 'training-row';
    const options = Object.keys(DAILY_ACTIVITIES);
    const isCustom = da.name === '__custom__';
    div.innerHTML = `
      <select class="da-name" style="flex:1;padding:8px;border:1px solid var(--border);border-radius:8px;font-size:13px;background:var(--surface);">
        <option value="">选择活动</option>
        ${options.map(o => `<option value="${escapeHTML(o)}" ${da.name===o?'selected':''}>${escapeHTML(o)}</option>`).join('')}
        <option value="__custom__" ${isCustom?'selected':''}>✏️ 直接输入消耗</option>
      </select>
      ${isCustom
        ? `<input class="da-kcal" value="${escapeHTML(String(da.kcal||''))}" placeholder="kcal" inputmode="numeric" style="width:70px;padding:8px;border:1px solid var(--border);border-radius:8px;font-size:13px;color:var(--accent);font-weight:600;" />`
        : `<input class="da-min" value="${escapeHTML(String(da.minutes||''))}" placeholder="分钟" inputmode="numeric" style="width:60px;padding:8px;border:1px solid var(--border);border-radius:8px;font-size:13px;" />`
      }
      <button class="row-del"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
    `;
    div.querySelector('.row-del').addEventListener('click', () => { div.remove(); updateEval(); });
    // 切换模式：重新渲染该行，保留已填值
    div.querySelector('.da-name').addEventListener('change', (e) => {
      const newName = e.target.value;
      const cur = { name: newName };
      if (newName === '__custom__') cur.kcal = div.querySelector('.da-kcal')?.value || '';
      else cur.minutes = div.querySelector('.da-min')?.value || '';
      const fresh = renderDailyRow(cur);
      div.replaceWith(fresh);
      updateEval();
    });
    return div;
  };
  if (dailyActivities.length > 0) dailyActivities.forEach(da => dailyWrap.appendChild(renderDailyRow(da)));
  $('#addDailyRow').addEventListener('click', () => { dailyWrap.appendChild(renderDailyRow({ name:'', minutes:'' })); updateEval(); });

  // 实时评估预览
  const updateEval = () => {
    const d = {
      breakfast: $('#d-breakfast').value.trim(),
      lunch: $('#d-lunch').value.trim(),
      dinner: $('#d-dinner').value.trim(),
      snack: $('#d-snack').value.trim(),
      snackTime: $('#d-snackTime')?.value || '',
      breakfastCal: $('#d-breakfastCal')?.value.trim() || '',
      lunchCal: $('#d-lunchCal')?.value.trim() || '',
      dinnerCal: $('#d-dinnerCal')?.value.trim() || '',
      snackCal: $('#d-snackCal')?.value.trim() || ''
    };
    const tr = [...rowsWrap.querySelectorAll('.training-row')].map(r => ({
      name: r.querySelector('.t-name').value.trim(),
      sets: r.querySelector('.t-sets').value.trim(),
      reps: r.querySelector('.t-reps').value.trim(),
      weight: r.querySelector('.t-weight').value.trim()
    })).filter(t => t.name || t.sets || t.reps || t.weight);
    // 日常活动
    const da = [...dailyWrap.querySelectorAll('.training-row')].map(r => {
      const name = r.querySelector('.da-name').value;
      if (name === '__custom__') return { name, kcal: r.querySelector('.da-kcal')?.value.trim() || '' };
      return { name, minutes: r.querySelector('.da-min')?.value.trim() || '' };
    }).filter(a => a.name === '__custom__' ? a.kcal : (a.name && a.minutes));
    const html = evalHTML(d, tr, da);
    $('#evalPreview').innerHTML = html || '<div style="font-size:12px;color:var(--muted);text-align:center;padding:8px;">填写饮食或训练后，这里会显示能量评估和建议</div>';
  };
  form.addEventListener('input', updateEval);
  rowsWrap.addEventListener('input', updateEval);
  rowsWrap.addEventListener('click', () => setTimeout(updateEval, 50));
  dailyWrap.addEventListener('input', updateEval);
  dailyWrap.addEventListener('change', updateEval);
  dailyWrap.addEventListener('click', () => setTimeout(updateEval, 50));
  updateEval();

  $('#saveRecord').addEventListener('click', () => {
    const diet = {
      breakfast: $('#d-breakfast').value.trim(),
      lunch: $('#d-lunch').value.trim(),
      dinner: $('#d-dinner').value.trim(),
      snack: $('#d-snack').value.trim(),
      snackTime: $('#d-snackTime')?.value.trim() || '',
      breakfastCal: $('#d-breakfastCal')?.value.trim() || '',
      lunchCal: $('#d-lunchCal')?.value.trim() || '',
      dinnerCal: $('#d-dinnerCal')?.value.trim() || '',
      snackCal: $('#d-snackCal')?.value.trim() || ''
    };
    const trainingRows = [...rowsWrap.querySelectorAll('.training-row')].map(r => ({
      name: r.querySelector('.t-name').value.trim(),
      sets: r.querySelector('.t-sets').value.trim(),
      reps: r.querySelector('.t-reps').value.trim(),
      weight: r.querySelector('.t-weight').value.trim()
    })).filter(t => t.name || t.sets || t.reps || t.weight);
    const dailyActivities = [...dailyWrap.querySelectorAll('.training-row')].map(r => {
      const name = r.querySelector('.da-name').value;
      if (name === '__custom__') return { name, kcal: r.querySelector('.da-kcal')?.value.trim() || '' };
      return { name, minutes: r.querySelector('.da-min')?.value.trim() || '' };
    }).filter(a => a.name === '__custom__' ? a.kcal : (a.name && a.minutes));
    const note = $('#d-note').value.trim();
    if (!diet.breakfast && !diet.lunch && !diet.dinner && !diet.snack && trainingRows.length === 0 && dailyActivities.length === 0 && !note) {
      toast('请至少填写一项'); return;
    }
    const data = { pid: currentPid, date: todayStr(), diet, training: trainingRows, dailyActivities, note, ts: Date.now() };
    if (existing) {
      Object.assign(existing, data);
    } else {
      DB.records.push({ id: uid(), ...data });
    }
    DB.save(); renderAll(); toast(existing ? '记录已更新' : '记录已保存');
  });
}

function buildHistoryList(records) {
  const wrap = $('#historyList');
  if (records.length === 0) {
    wrap.innerHTML = emptyHTML('note', '还没有记录', '在上方填写今日的饮食和训练');
    return;
  }
  const hasDiet = (d) => d && (d.breakfast || d.lunch || d.dinner || d.snack);
  wrap.innerHTML = records.map(r => `
    <div class="history-card glass" data-id="${r.id}">
      <div class="history-head">
        <div class="history-date">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
          ${fmtDate(r.date)}
          ${isToday(r.date) ? '<span class="history-date-today">今天</span>' : ''}
        </div>
        <button class="history-del" data-act="del">删除</button>
      </div>
      ${hasDiet(r.diet) ? `
      <div class="history-block">
        <div class="history-block-title" style="color:var(--success);">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8h1a4 4 0 0 1 0 8h-1M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V8z"/></svg>
          饮食
        </div>
        <div class="history-diet">
          ${r.diet.breakfast ? `<div class="history-diet-item"><b>早</b>${escapeHTML(r.diet.breakfast)}</div>` : ''}
          ${r.diet.lunch ? `<div class="history-diet-item"><b>午</b>${escapeHTML(r.diet.lunch)}</div>` : ''}
          ${r.diet.dinner ? `<div class="history-diet-item"><b>晚</b>${escapeHTML(r.diet.dinner)}</div>` : ''}
          ${r.diet.snack ? `<div class="history-diet-item"><b>加餐${r.diet.snackTime?' '+escapeHTML(r.diet.snackTime):''}</b>${escapeHTML(r.diet.snack)}</div>` : ''}
        </div>
      </div>` : ''}
      ${r.training && r.training.length ? `
      <div class="history-block">
        <div class="history-block-title" style="color:var(--accent);">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 6.5h11M6.5 17.5h11M3 9.5h3v5H3zM18 9.5h3v5h-3z"/></svg>
          训练
        </div>
        <div class="history-training">
          ${r.training.map(t => `<div class="history-train-item"><span class="history-train-name">${escapeHTML(t.name)}</span>${t.sets||t.reps||t.weight ? `<span class="history-train-meta">${t.sets?'×'+escapeHTML(t.sets):''} ${t.reps?escapeHTML(t.reps)+'次':''} ${t.weight?escapeHTML(t.weight)+'kg':''}</span>` : ''}</div>`).join('')}
        </div>
      </div>` : ''}
      ${r.note ? `<div class="history-block"><div class="history-note">${escapeHTML(r.note)}</div></div>` : ''}
      <div class="history-block">${evalHTML(r.diet, r.training || [], r.dailyActivities || [])}</div>
    </div>
  `).join('');
  wrap.querySelectorAll('.history-card').forEach(el => {
    const id = +el.dataset.id;
    const rec = DB.records.find(x => x.id === id);
    el.style.cursor = 'pointer';
    el.querySelector('[data-act="del"]').addEventListener('click', (e) => {
      e.stopPropagation();
      DB.records = DB.records.filter(x => x.id !== id); DB.save(); renderAll(); toast('记录已删除');
    });
    // 点击卡片编辑今日记录
    el.addEventListener('click', (e) => {
      if (e.target.closest('[data-act="del"]')) return;
      if (rec) { buildRecordForm(rec); el.scrollIntoView({behavior:'smooth', block:'center'}); }
    });
  });
}

/* ===== 通用记录（适用于阅读等自定义项目） ===== */
function renderGenericRecords() {
  const panel = $('#panel-records');
  if (!panel) return;
  const records = DB.genericRecords.filter(r => r.pid === currentPid).slice().sort((a,b) => (b.date || '').localeCompare(a.date || ''));

  panel.innerHTML = `
    <div style="margin-bottom:12px;"><button class="btn btn-primary" id="addGenericBtn" style="width:auto;padding:10px 20px;">
      <svg style="display:inline-block;width:16px;height:16px;vertical-align:-2px;margin-right:4px;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>添加记录
    </button></div>
    <div id="genericList"></div>
  `;
  $('#addGenericBtn').addEventListener('click', () => openGenericRecordEditor());
